<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>JH撮影</title>
<style>
/* One-handed field app: map up top (look), card in the middle (read), controls in the bottom third (thumb). */
:root {
  --bg: #eef1f3; --surface: #ffffff; --ink: #121c25; --muted: #56636f; --line: #d3dae0;
  --accent: #d9480f; --accent-ink: #ffffff; --done: #24784a; --done-bg: #e1f1e7;
  --peak: #fff0c7; --peak-line: #e0ac3a; --ng: #a51d1d;
  --leg1: #d9480f; --leg2: #1c64b0; --leg3: #7b3fb5;
  --grass: #e2eede; --water: #cde2f2; --road: #dfe2e5; --zone: #ffffff; --zone-line: #9cb09f; --lot: #eaedf0; --map-ink: #2a3832;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  --tabbar: 58px; --actionbar: 76px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1116; --surface: #151e26; --ink: #e8eef3; --muted: #9aa9b5; --line: #26333e;
    --accent: #ff7a3d; --accent-ink: #1a0b03; --done: #63cf93; --done-bg: #14301f;
    --peak: #362c10; --peak-line: #a17d28; --ng: #ff8d8d;
    --leg1: #ff7a3d; --leg2: #5aa6ee; --leg3: #b98af0;
    --grass: #182820; --water: #142d45; --road: #262c33; --zone: #1b252e; --zone-line: #485e50; --lot: #1f272e; --map-ink: #d3e0d8;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
b { font-weight: 800; }

#app { display: flex; flex-direction: column; height: 100%; }
.top { flex: 0 0 auto; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 6px) max(14px, env(safe-area-inset-right, 0px)) 6px max(14px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px; }
.clock { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.top .sub { font-size: 12px; color: var(--muted); line-height: 1.3; min-width: 0; flex: 1; }
.top .sub b { color: var(--ink); }
.wake { font-size: 12px; font-weight: 700; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 10px; color: var(--muted); white-space: nowrap; }
.wake[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

.views { flex: 1 1 auto; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 12px max(14px, env(safe-area-inset-right, 0px)) 24px max(14px, env(safe-area-inset-left, 0px)); }
.view[hidden], #v-shoot[hidden] { display: none; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* tab bar (bottom, thumb) */
.tabbar { flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.tabbar button { height: var(--tabbar); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tabbar svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

/* shoot view */
#v-shoot { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
.mini { flex: 0 0 auto; height: min(34vh, 270px); background: var(--grass); border-bottom: 1px solid var(--line); position: relative; }
.mini svg { width: 100%; height: 100%; display: block; }
.mini .modes { position: absolute; left: 10px; top: 10px; display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.mini .modes button { font-size: 13px; font-weight: 800; padding: 6px 12px; border-radius: 7px; color: var(--muted); }
.mini .modes button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.mini .full { position: absolute; right: 10px; top: 10px; font-size: 12px; font-weight: 800; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.cardwrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px max(14px, env(safe-area-inset-right, 0px)) 16px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.pos { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 700; }
.pos .bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; align-self: center; }
.pos .bar i { display: block; height: 100%; background: var(--done); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.card.peak { background: var(--peak); border-color: var(--peak-line); }
.card.isdone { background: var(--done-bg); border-color: transparent; }
.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.big-time { font-size: 34px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.pill { font-size: 13px; font-weight: 800; border-radius: 999px; padding: 2px 10px; background: var(--bg); border: 1px solid var(--line); }
.tag { font-size: 12px; font-weight: 800; color: var(--accent); }
.donetag { font-size: 12px; font-weight: 800; color: var(--done); }
.rel { font-size: 13px; font-weight: 700; color: var(--muted); }
.what { font-size: 19px; font-weight: 700; line-height: 1.45; }
.note { font-size: 15px; color: var(--muted); }
.next { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; padding: 0 2px; }
.next b { color: var(--ink); }
.firm { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.firm.complete { background: var(--done-bg); border-color: transparent; }
.firm-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.firm-name { font-weight: 800; font-size: 16px; min-width: 0; }
.firm-what { font-size: 13px; color: var(--muted); font-weight: 400; }
.count { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.firm.complete .count { color: var(--done); }
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.chip { min-height: 48px; font-size: 14px; font-weight: 800; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); }
.chip[aria-checked="true"] { background: var(--done); border-color: var(--done); color: var(--surface); }

.actionbar { flex: 0 0 auto; display: grid; grid-template-columns: 58px 58px 1fr; gap: 8px; padding: 8px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.actionbar button { height: 60px; border-radius: 14px; font-weight: 800; }
.btn-sub { background: var(--bg); border: 1.5px solid var(--line) !important; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.btn-sub svg { width: 22px; height: 22px; }
.btn-main { background: var(--accent); color: var(--accent-ink); font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.btn-main:active { transform: translateY(2px); box-shadow: none; }
.btn-main.nextonly { background: var(--ink); color: var(--surface); }

/* lists */
.seg { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { font-size: 15px; font-weight: 800; padding: 10px 2px; border-radius: 9px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
h2 { font-size: 22px; font-weight: 800; }
h3 { font-size: 13px; letter-spacing: .06em; color: var(--muted); margin-top: 6px; }
.lead { color: var(--muted); font-size: 14px; }
.row { display: grid; grid-template-columns: 52px 1fr; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: left; width: 100%; }
.row.peak { background: var(--peak); border-color: var(--peak-line); }
.row.cur { box-shadow: 0 0 0 3px var(--accent); }
.row[aria-checked="true"] { background: var(--done-bg); border-color: transparent; }
.row .tickbtn { display: grid; place-items: center; border-right: 1px solid var(--line); }
.row[aria-checked="true"] .tickbtn { border-color: transparent; }
.tick { width: 28px; height: 28px; border-radius: 8px; border: 2.5px solid var(--muted); display: grid; place-items: center; }
.tick svg { width: 18px; height: 18px; opacity: 0; }
[aria-checked="true"] > .tickbtn .tick, .item[aria-checked="true"] .tick { background: var(--done); border-color: var(--done); }
[aria-checked="true"] > .tickbtn .tick svg, .item[aria-checked="true"] .tick svg { opacity: 1; }
.row .rbody { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; }
.row .meta { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.row .t { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.row .w { font-size: 15px; }
.row[aria-checked="true"] .w { color: var(--muted); }
.row .n { font-size: 13px; color: var(--muted); }
.item { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: left; width: 100%; font-size: 15px; }
.item[aria-checked="true"] { background: var(--done-bg); border-color: transparent; color: var(--muted); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.box ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.ng li { color: var(--ng); }
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.key { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.key .kt { font-size: 24px; font-weight: 800; color: var(--accent); line-height: 1.2; font-variant-numeric: tabular-nums; }
.key .kd { font-size: 13px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); }
.group-time { font-size: 15px; font-weight: 800; color: var(--muted); margin-top: 6px; }
.empty { text-align: center; color: var(--muted); padding: 16px; }
.contact { user-select: all; -webkit-user-select: all; font-weight: 800; font-variant-numeric: tabular-nums; }

/* full map */
.mapbox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.mapbox svg { width: 100%; height: auto; display: block; }
.legs { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.legs button { display: grid; grid-template-columns: 32px 50px 1fr; gap: 8px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 15px; }
.legs button.cur { box-shadow: 0 0 0 3px var(--accent); }
.legs button[aria-checked="true"] { background: var(--done-bg); border-color: transparent; color: var(--muted); }
.legs .num { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 13px; }
.legs .lt { font-weight: 800; font-variant-numeric: tabular-nums; }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + var(--actionbar) + env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); background: var(--ink); color: var(--surface); font-weight: 800; font-size: 15px; padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; }
.toast.show { opacity: 1; }
.install { background: var(--peak); border: 1px solid var(--peak-line); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.install b { font-weight: 800; }
@keyframes pulse { 0% { r: 12; opacity: .55; } 100% { r: 28; opacity: 0; } }
.pulse { animation: pulse 1.6s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .toast, .btn-main { transition: none; } }

/* status, cuts and next move on the shoot screen */
.catch { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--ink); color: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.catch b { font-weight: 800; }
.catch button { flex: 0 0 auto; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 15px; border-radius: 10px; padding: 10px 14px; }
.status { border-radius: 12px; padding: 9px 12px; display: flex; flex-direction: column; gap: 1px; font-size: 13px; }
.status b { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.status.wait { background: var(--bg); border: 1.5px solid var(--leg2); color: var(--leg2); }
.status.on { background: var(--done-bg); color: var(--done); }
.status.late { background: var(--ng); color: #fff; }
.sec { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; letter-spacing: 0; color: var(--ink); font-weight: 800; margin-top: 2px; }
.sec span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.shots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.shot { display: flex; align-items: center; gap: 8px; min-height: 52px; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 14px; font-weight: 700; line-height: 1.3; }
.shot .tick { width: 24px; height: 24px; flex: 0 0 auto; border-width: 2px; border-radius: 7px; }
.shot[aria-checked="true"] { background: var(--done-bg); border-color: var(--done); color: var(--muted); }
.shot[aria-checked="true"] .tick { background: var(--done); border-color: var(--done); }
.shot[aria-checked="true"] .tick svg { opacity: 1; }
.nextbox { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; background: var(--surface); border: 2px dashed var(--leg2); border-radius: 14px; padding: 12px; }
.nextbox .nl { background: var(--leg2); color: #fff; font-weight: 800; border-radius: 8px; text-align: center; padding: 6px 0; font-size: 14px; }
.nextbox .nt { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.nextbox .nw { font-size: 14px; }
.nextbox .nm { font-size: 13px; font-weight: 800; color: var(--leg2); margin-top: 2px; }
.undo { align-self: flex-start; font-size: 13px; font-weight: 800; color: var(--muted); border: 1.5px solid var(--line) !important; border-radius: 999px; padding: 4px 12px; margin-top: 4px; }
.btn-main small { font-size: 12px; font-weight: 700; opacity: .9; display: block; }
.btn-main .lbl { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.block { font-size: 14px; font-weight: 800; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; }
.row .prog { font-size: 12px; font-weight: 800; color: var(--muted); }
.swipehint { text-align: center; font-size: 12px; color: var(--muted); }
/* v3: instructions first, flexible pool below, location bar at the thumb */
#v-now { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
#v-now[hidden] { display: none; }
#mini2 { height: min(26vh, 210px); }
.missbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 46px; border-radius: 12px; padding: 0 12px; background: var(--surface); border: 2px solid var(--ng) !important; color: var(--ng); font-size: 14px; }
.missbar b { font-weight: 800; }
.missbar span { font-size: 12px; font-weight: 700; }
.nowwrap > * { flex-shrink: 0; }
.nowwrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px max(14px, env(safe-area-inset-right, 0px)) 18px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.ins { border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; color: #fff; }
.ins .note { color: inherit; opacity: .92; }
.ins-k { font-size: 13px; font-weight: 800; letter-spacing: .04em; opacity: .9; }
.ins-t { font-size: 26px; font-weight: 800; line-height: 1.2; }
.ins-s { font-size: 15px; font-weight: 700; }
.ins.go { background: var(--ng); }
.ins.must { background: var(--surface); color: var(--ink); border: 3px solid var(--accent); }
.ins.must .ins-k { color: var(--accent); }
.ins.must .note { color: var(--muted); }
.ins.free { background: var(--done); }
.ins.pre { background: var(--ink); color: var(--surface); }
.big { height: 58px; border-radius: 14px; font-size: 19px; font-weight: 800; background: #fff; color: var(--ng); margin-top: 6px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.big.ok { background: var(--accent); color: var(--accent-ink); }
.big:active { transform: translateY(2px); box-shadow: none; }
.missed, .task { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.missed { background: var(--surface); border: 2px solid var(--ng); }
.missed b, .task b { display: block; font-weight: 800; }
.missed span, .task span { font-size: 13px; color: var(--muted); }
.mbtns { display: flex; gap: 6px; flex: 0 0 auto; }
.mbtns button, .task > button { font-size: 13px; font-weight: 800; padding: 9px 10px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--bg); }
.mbtns button:first-child { background: var(--done); border-color: var(--done); color: #fff; }
.task { background: var(--peak); border: 1.5px solid var(--peak-line); }
.task.urgent { border: 2.5px solid var(--ng); }
.sec.lg { font-size: 16px; margin-top: 6px; }
.spot { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; }
.spot.pa { border-left: 6px solid var(--accent); }
.spot.dim { opacity: .55; }
.spot.open { border-color: var(--leg2); box-shadow: 0 0 0 2px var(--leg2); opacity: 1; }
.spot-head { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 12px; min-height: 60px; }
.spot-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.spot-main b { font-size: 17px; font-weight: 800; }
.spot-sub { font-size: 13px; color: var(--muted); font-weight: 700; }
.chev { color: var(--muted); font-size: 13px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tags i { font-style: normal; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 1px 7px; }
.tags .now { background: var(--done); color: #fff; }
.tags .soon { background: var(--bg); color: var(--leg2); border: 1px solid var(--leg2); }
.tags .late { background: var(--ng); color: #fff; }
.tags .mute { background: var(--bg); color: var(--muted); }
.spot-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.hint { font-size: 14px; background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.spot-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
.sb { min-height: 58px; border-radius: 12px; font-size: 15px; font-weight: 800; line-height: 1.2; }
.sb small { font-size: 11px; font-weight: 700; }
.sb.wait { background: var(--bg); border: 2px solid var(--line) !important; }
.sb.ok { background: var(--accent); color: var(--accent-ink); }
.more { min-height: 48px; border-radius: 12px; border: 1.5px dashed var(--line) !important; font-weight: 800; color: var(--muted); }
.herebar { flex: 0 0 auto; background: var(--surface); border-top: 1px solid var(--line); padding: 8px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); }
.here-btn { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 10px; border-radius: 12px; background: var(--bg); border: 1.5px solid var(--line) !important; padding: 0 14px; text-align: left; }
.here-btn span { font-size: 12px; color: var(--muted); font-weight: 800; }
.here-btn b { flex: 1; font-size: 17px; font-weight: 800; }

function baseMap() {
  const z = ZONES.map(o => {
    const fill = o.kind === 'lot' ? 'var(--lot)' : 'var(--zone)';
    let t = '';
    if (o.label) {
      if (o.out && o.vertical) t = `<text x="${o.x + o.w + 18}" y="${o.y + o.h / 2}" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--map-ink)" style="writing-mode:vertical-rl;letter-spacing:1px">${o.label}</text>`;
      else if (o.out) t = `<text x="${o.x + o.w + 5}" y="${o.y + o.h / 2 + 4}" font-size="10.5" font-weight="700" fill="var(--map-ink)">${o.label}</text>`;
      else if (o.vertical) t = `<text x="${o.x + o.w / 2}" y="${o.y + o.h / 2}" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="var(--map-ink)" style="writing-mode:vertical-rl;letter-spacing:1px">${o.label}</text>`;
      else {
        const ly = o.at === 'bottom' ? o.y + o.h - 8 : o.y + 14;
        t = `<text x="${o.x + o.w / 2}" y="${ly}" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--map-ink)">${o.label}</text>`;
        (o.sub || []).forEach((s, i) => { t += `<text x="${o.x + o.w / 2}" y="${ly + 14 + i * 12}" font-size="8.5" text-anchor="middle" fill="var(--map-ink)" opacity=".75">${s}</text>`; });
      }
    }
    return `<g${o.faint ? ' opacity=".7"' : ''}><rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="5" fill="${fill}" stroke="var(--zone-line)"/>${t}</g>`;
  }).join('');
  const cols = SUBCOLS.map(c => `<rect x="${c.x}" y="349" width="${c.w}" height="134" rx="3" fill="none" stroke="var(--zone-line)" stroke-dasharray="3 2"/><text x="${c.x + c.w / 2}" y="478" font-size="9.5" font-weight="700" text-anchor="middle" fill="var(--map-ink)">${c.label}</text>`).join('');
  return `
    <rect x="-400" y="-400" width="1160" height="1340" fill="var(--surface)"/>
    <rect x="128" y="10" width="200" height="526" rx="10" fill="var(--grass)"/>

    <text x="116" y="420" font-size="8.5" text-anchor="middle" fill="var(--map-ink)" style="writing-mode:vertical-rl">市役所東道路 9:30〜16:30 歩行者天国</text>
    ${z}${cols}
    <path d="M204 236 Q226 214 248 236" fill="none" stroke="var(--zone-line)" stroke-width="5" stroke-linecap="round"/><text x="196" y="232" font-size="9.5" text-anchor="end" fill="var(--map-ink)">アーチ</text>
    <g transform="translate(306 300)"><rect x="-11" y="-8" width="22" height="16" rx="3" fill="var(--map-ink)"/><circle r="4.5" fill="var(--surface)"/><text x="0" y="21" font-size="9" font-weight="700" text-anchor="middle" fill="var(--map-ink)">GoPro</text><text x="0" y="31" font-size="7.5" text-anchor="middle" fill="var(--map-ink)" opacity=".75">場所は前日決定</text></g>
    <g transform="translate(26 30)"><path d="M0 14 L6 -2 L12 14 L6 9 Z" fill="var(--map-ink)"/><text x="6" y="28" font-size="9" text-anchor="middle" fill="var(--map-ink)">北</text></g>`;
}
const ARW = c => `<marker id="arw-${c}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--${c})"/></marker>`;

const mm = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t); return m ? +m[1] * 60 + +m[2] : null; };
const hhmm = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const live = () => S.sim.on || today() === DATE[S.mode];
const nowMin = () => { if (S.sim.on) return S.sim.min; const t = jst(); return t.h * 60 + t.mi; };
const shotKeys = id => { const [m, t] = id.split(/:(.*)/); return (SHOTS[id] || []).map((_, k) => `s-${m}-${t}-${k}`); };
const shotsDone = id => shotKeys(id).every(k => done.has(k));
const firmDone = fi => CUTS.every(([c]) => done.has(`f${fi}-${c}`));
const firmCount = fi => CUTS.filter(([c]) => done.has(`f${fi}-${c}`)).length;

// walking: map units are roughly metres; 70 m a minute; crossing the road to the north lot adds 2 minutes
const XING = l => !!l && l[0] === 'k';
function walkMin(a, b) {
  if (!a || !b || !LOC[a] || !LOC[b]) return 0;
  const p = LOC[a], q = LOC[b], d = Math.hypot(p[0] - q[0], p[1] - q[1]) * 1.1;
  return Math.ceil(d / 70) + (XING(a) !== XING(b) ? 2 : 0);
}
const placeName = l => (l ? LOC_NAME[l] : '会場全域');
const destName = l => (l ? LOC_NAME[l] : '撮影位置');

// ----- spots -----
const spotKey = s => s.key || (s.id[0] === 'e' && /^e\d+$/.test(s.id) ? s.id : 'p-' + s.id);
function spotDone(s) {
  if (done.has(spotKey(s))) return true;
  const fs = s.firms || [];
  return fs.length > 0 && fs.every(firmDone) && (!s.shots || shotsDone(s.shots));
}
function spotProgress(s) {
  const fs = s.firms || [];
  const items = fs.length * 5 + (s.shots ? shotKeys(s.shots).length : 0);
  const got = fs.reduce((a, fi) => a + firmCount(fi), 0) + (s.shots ? shotKeys(s.shots).filter(k => done.has(k)).length : 0);
  return { got, items };
}
function spotState(s, m) {
  const wins = s.win.map(([a, b]) => [mm(a), mm(b)]);
  const cur = wins.find(([a, b]) => a <= m && m < b);
  const nextWin = wins.find(([a]) => a > m);
  const lastEnd = Math.max(...wins.map(w => w[1]));
  let session = null, nextSession = null;
  (s.sessions || []).forEach(([t, dur, label]) => {
    const a = mm(t);
    if (a <= m && m < a + dur) session = { a, end: a + dur, label };
    else if (a > m && !nextSession) nextSession = { a, label };
  });
  return { open: !!cur, closesAt: cur ? cur[1] : null, opensAt: nextWin ? nextWin[0] : null, over: m >= lastEnd, lastEnd, session, nextSession };
}

// ----- the instruction engine -----
function plan(m) {
  const evs = EV[S.mode].filter(e => !e.cond || e.cond());
  const pending = evs.filter(e => !done.has(e.key) && !S.skip[e.key]);
  const active = pending.find(e => e.kind === 'fixed' && mm(e.from) <= m && m < mm(e.to));
  const tasks = pending.filter(e => e.kind === 'task' && mm(e.from) <= m && m < mm(e.to));
  const missed = pending.filter(e => m >= mm(e.to));
  const next = pending.filter(e => mm(e.from) > m).sort((a, b) => mm(a.from) - mm(b.from));
  const nextFixed = next.find(e => e.kind === 'fixed') || null;
  let leaveAt = null, walk = 0, free = null;
  if (nextFixed) { walk = walkMin(S.here, nextFixed.loc); leaveAt = mm(nextFixed.from) - walk - S.buffer; free = leaveAt - m; }
  return { active, tasks, missed, nextFixed, next, leaveAt, walk, free };
}

function suggestions(m, free) {
  const list = [];
  SPOTS[S.mode].forEach(s => {
    if (spotDone(s)) return;
    const st = spotState(s, m);
    const soon = st.opensAt !== null && st.opensAt - m <= 15;
    if (!st.open && !soon) return;
    const walk = walkMin(S.here, s.loc);
    const snoozed = S.snooze[s.id] && S.snooze[s.id] > m;
    const fits = free === null || walk + 5 <= free;
    let score = { A: 30, B: 15, C: 0 }[s.pri];
    const toClose = st.open ? st.closesAt - m : null;
    const finalClose = st.open && st.closesAt === st.lastEnd;
    if (toClose !== null && toClose <= 60) score += (60 - toClose) * (finalClose ? 1 : 0.5);
    if (st.session) score += 18;
    else if (st.nextSession && st.nextSession.a - m <= 15) score += 12;
    if (!st.open) score -= 20;
    score -= walk * 5;
    if (!fits) score -= 40;
    if (snoozed) score -= 100;
    const tags = [];
    if (st.session) tags.push(['now', `${st.session.label}開催中（〜${hhmm(st.session.end)}）`]);
    else if (st.nextSession && st.nextSession.a - m <= 30) tags.push(['soon', `次の${st.nextSession.label} ${hhmm(st.nextSession.a)}`]);
    if (!st.open) tags.push(['soon', `${hhmm(st.opensAt)}から`]);
    else if (finalClose && toClose <= 45) tags.push(['late', `${hhmm(st.closesAt)}で終了 あと${toClose}分`]);
    else if (toClose !== null && toClose <= 30) tags.push(['soon', `${hhmm(st.closesAt)}でいったん中断`]);
    if (snoozed) tags.push(['mute', `${hhmm(S.snooze[s.id])}まで保留`]);
    if (!fits) tags.push(['mute', '次の必須に間に合わない']);
    list.push({ s, st, walk, score, tags, snoozed, fits });
  });
  return list.sort((a, b) => b.score - a.score);
}

// ================= rendering =================
const $ = id => document.getElementById(id);
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800); }
function buzz(p = 15) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const chip = (k, label) => `<button class="chip" role="checkbox" aria-checked="${done.has(k)}" data-key="${k}">${label}</button>`;
const shotBtn = (k, text) => `<button class="shot" role="checkbox" aria-checked="${done.has(k)}" data-key="${k}"><span class="tick">${TICK}</span><span>${esc(text)}</span></button>`;
function firmCard(fi) {
  const f = FIRMS[fi], n = firmCount(fi);
  return `<div class="firm${n === 5 ? ' complete' : ''}"><div class="firm-top"><div class="firm-name">${esc(f[1])}<div class="firm-what">${esc(f[2])}</div></div><span class="count">${n}/5</span></div>
    <div class="chips">${CUTS.map(([c, l]) => chip(`f${fi}-${c}`, l)).join('')}</div></div>`;
}
function shotsBlock(id) {
  const ks = shotKeys(id); if (!ks.length) return '';
  const got = ks.filter(k => done.has(k)).length;
  return `<div class="sec">撮るカット<span>${got}/${ks.length}</span></div><div class="shots">${SHOTS[id].map((t, k) => shotBtn(ks[k], t)).join('')}</div>`;
}

function eventBody(e) {
  return `${e.note ? `<div class="note">${fmt(e.note)}</div>` : ''}
    ${e.shots ? shotsBlock(e.shots) : ''}
    ${(e.firms || []).length ? `<div class="sec">この場の会社<span>${e.firms.filter(firmDone).length}/${e.firms.length}社</span></div>${e.firms.map(firmCard).join('')}` : ''}`;
}

function renderNow() {
  const m = nowMin(), P = plan(m);
  let html = '';
  const firstFrom = Math.min(...EV[S.mode].map(e => mm(e.from)).filter(x => x !== null));
  const early = live() && m < firstFrom - 30;
  if (early) {
    const f = EV[S.mode].slice().sort((a, b) => mm(a.from) - mm(b.from))[0];
    html += `<div class="ins pre"><div class="ins-k">開始前</div><div class="ins-t">最初は ${esc(f.at)} ${esc(f.title)}</div><div class="ins-s">${esc(placeName(f.loc))}・${esc(f.from)}から。その30分前から指示を出します</div></div>`;
  }
  if (!live()) {
    html += `<div class="ins pre"><div class="ins-k">本番前</div><div class="ins-t">${S.mode === 'eve' ? '前日 10/31' : '当日 11/1'}になると、時刻に合わせて指示が出ます</div><div class="ins-s">要点タブの「リハーサル」で時刻を指定すると、今のうちに動きを試せます</div></div>`;
  }
  if (live() && !early && P.active) {
    const e = P.active, left = mm(e.to) - m, started = m >= mm(e.at);
    html += `<div class="ins must"><div class="ins-k">いま必須：ここを撮る</div><div class="ins-t">${esc(e.at)} ${esc(e.title)}</div><div class="ins-s">${esc(placeName(e.loc))}・${started ? `終了まで あと${left}分` : `開始まで あと${mm(e.at) - m}分`}</div>
      ${eventBody(e)}
      <button class="big ok" data-done-ev="${e.key}">✓ 撮り終えた</button></div>`;
  } else if (live() && !early && P.nextFixed && m >= P.leaveAt) {
    const e = P.nextFixed, startIn = mm(e.from) - m;
    html += `<div class="ins go"><div class="ins-k">今すぐ移動</div><div class="ins-t">${esc(destName(e.loc))}へ</div><div class="ins-s">${esc(e.at)} ${esc(e.title)}・開始まで あと${startIn}分${S.here ? `（徒歩約${P.walk}分）` : ''}</div>
      <div class="note">${fmt(e.note || '')}</div>
      <button class="big" data-arrive="${e.loc || ''}">着いた</button></div>`;
  } else if (live() && !early && P.nextFixed) {
    const e = P.nextFixed;
    html += `<div class="ins free"><div class="ins-k">自由に撮れる時間</div><div class="ins-t">あと${P.free}分</div><div class="ins-s">${hhmm(P.leaveAt)}に${esc(destName(e.loc))}へ移動開始（${esc(e.at)} ${esc(e.title)}）</div></div>`;
  } else if (live() && !early) {
    html += `<div class="ins free"><div class="ins-k">必須の撮影は終わり</div><div class="ins-t">残りを埋める時間</div><div class="ins-s">下の候補から撮れていないものを</div></div>`;
  }
  // the rest of today's must-shoot items, always visible
  {
    const evs = EV[S.mode].filter(e => !e.cond || e.cond() || done.has(e.key));
    const nDone = evs.filter(e => done.has(e.key)).length;
    const upcoming = evs.filter(e => !done.has(e.key) && !S.skip[e.key] && (!live() || mm(e.to) > m) && e !== P.active);
    html += `<div class="mustlist"><div class="mh"><b>必須</b><span>${nDone}/${evs.length} 済</span></div>` +
      upcoming.slice(0, S.showMust ? 99 : 4).map(e => {
        const inWin = live() && mm(e.from) <= m;
        const d = mm(e.from) - m;
        const when = !live() ? '' : inWin ? `<i class="late">${e.kind === 'task' ? `${hhmm(mm(e.to))}まで` : 'いま'}</i>` : `<i>あと${d >= 60 ? `${Math.floor(d / 60)}時間${d % 60}分` : `${d}分`}</i>`;
        return `<button class="mrow${inWin ? ' hot' : ''}" data-open-must="${e.key}"><span class="mt">${esc(e.at)}</span><span class="mb">${esc(e.title)}<small>${esc(placeName(e.loc))}${e.kind === 'task' ? `・${esc(e.from)}〜${esc(e.to)}の間に` : ''}</small></span>${when}</button>` +
          (S.open === 'must:' + e.key ? `<div class="card">${eventBody(e)}<button class="big ok" data-done-ev="${e.key}">✓ 撮り終えた</button></div>` : '');
      }).join('') +
      (upcoming.length > 4 ? `<button class="more" data-toggle-must="1">${S.showMust ? '閉じる' : `残りの必須をすべて表示（あと${upcoming.length - 4}件）`}</button>` : '') +
      (!upcoming.length ? '<p class="lead">残りの必須はありません</p>' : '') + '</div>';
  }
  // missed must-shoot items: one line, opens on tap
  if (P.missed.length) {
    html += `<button class="missbar" data-toggle-missed="1"><b>撮り逃し ${P.missed.length}件</b><span>${S.showMissed ? '閉じる ▲' : '撮れていたらタップして確認 ▼'}</span></button>`;
    if (S.showMissed) P.missed.forEach(e => {
      html += `<div class="missed"><div><b>${esc(e.at)} ${esc(e.title)}</b><span>${hhmm(mm(e.to))}で終了</span></div><div class="mbtns"><button data-done-ev="${e.key}">撮れた</button><button data-skip-ev="${e.key}">あきらめる</button></div></div>`;
    });
  }
  // deadline tasks
  P.tasks.forEach(e => {
    const left = mm(e.to) - m, urgent = left <= 20;
    html += `<div class="task${urgent ? ' urgent' : ''}"><div><b>${urgent ? 'まもなく期限' : '期限つき'}：${esc(e.title)}</b><span>${esc(placeName(e.loc))}・${hhmm(mm(e.to))}まで（あと${left}分）</span></div><button data-open-ev="${e.key}">開く</button></div>`;
    if (S.open === 'ev:' + e.key) html += `<div class="card">${eventBody(e)}<button class="big ok" data-done-ev="${e.key}">✓ 済んだ</button></div>`;
  });
  // flexible pool
  if (live() && !early && !P.active) {
    const sug = suggestions(m, P.free);
    const top = S.showAll ? sug : sug.slice(0, 6);
    html += `<div class="sec lg">いま撮れる候補<span>${sug.length}件</span></div>`;
    if (!sug.length) html += '<p class="empty">いま開いている候補はありません</p>';
    top.forEach(x => { html += spotCard(x, m); });
    if (!S.showAll && sug.length > top.length) html += `<button class="more" data-show-all="1">ほかの候補を表示（${sug.length - top.length}件）</button>`;
    const left = SPOTS[S.mode].filter(s => !spotDone(s) && spotState(s, m).over);
    if (left.length) html += `<div class="sec">終了して撮れなかったもの<span>${left.length}件</span></div><p class="lead">${left.map(s => esc(s.name)).join('、')}</p>`;
  }
  if (!live()) {
    html += `<div class="sec lg">${S.mode === 'eve' ? '前日' : '当日'}の必須</div>` + EV[S.mode].map(e => `<div class="evrow${done.has(e.key) ? ' isdone' : ''}"><span class="t">${esc(e.at)}</span><span>${esc(e.title)}<small>${esc(placeName(e.loc))}</small></span></div>`).join('');
  }
  $('nowwrap').innerHTML = html;
  renderHereBar();
  const mini = $('mini2');
  if (mini) { mini.innerHTML = miniNow(P, m, mini.clientWidth || 390, mini.clientHeight || 200); }
}

function spotCard(x, m) {
  const s = x.s, pr = spotProgress(s), open = S.open === s.id;
  return `<div class="spot${x.snoozed || !x.fits ? ' dim' : ''}${open ? ' open' : ''}${s.pri === 'A' ? ' pa' : ''}">
    <button class="spot-head" data-open-spot="${s.id}">
      <span class="spot-main"><b>${esc(s.name)}</b><span class="spot-sub">${esc(placeName(s.loc))}${S.here && s.loc ? `・徒歩${x.walk}分` : ''}${pr.items ? `・${pr.got}/${pr.items}カット` : ''}</span>
      ${x.tags.length ? `<span class="tags">${x.tags.map(([c, t]) => `<i class="${c}">${esc(t)}</i>`).join('')}</span>` : ''}</span>
      <span class="chev">${open ? '▲' : '▼'}</span>
    </button>
    ${open ? `<div class="spot-body"><div class="hint">${esc(s.hint)}</div>
      ${s.shots ? shotsBlock(s.shots) : ''}
      ${(s.firms || []).map(firmCard).join('')}
      <div class="spot-btns"><button class="sb wait" data-snooze="${s.id}">子どもがいない<br><small>20分後にまた出す</small></button><button class="sb ok" data-spot-done="${s.id}">✓ 撮り終えた</button></div>
    </div>` : ''}
  </div>`;
}

const HERE_OPTS = ['kShow', 'kensetsu', 'sharyo', 'sanemu', 'honbu', 'stage', 'arch', 'inshoku', 'kinyu', 'drone', 'river', 'gopro'];
const HERE_LABEL = { kShow: '北庁舎', kensetsu: '南 建設', sharyo: '南 車両', sanemu: '南端', honbu: '本部', stage: 'ステージ', arch: 'アーチ', inshoku: '北 飲食', kinyu: '北 金融', drone: '北 ドローン', river: '川沿い', gopro: 'GoPro' };
function renderHereBar() {
  const b = $('herebar'); if (!b) return;
  b.innerHTML = S.hereOpen
    ? `<div class="here-grid">${HERE_OPTS.map(l => `<button data-here="${l}" aria-pressed="${S.here === l}">${HERE_LABEL[l]}</button>`).join('')}</div>`
    : `<button class="here-btn" data-here-toggle="1"><span>いる場所</span><b>${S.here ? HERE_LABEL[S.here] || placeName(S.here) : '未設定（タップして選ぶ）'}</b><span class="chg">変更</span></button>`;
}

// mini map: where I am, the next must-shoot spot, and open suggestions
function miniNow(P, m, w, h) {
  const pts = [];
  if (S.here && LOC[S.here]) pts.push(LOC[S.here]);
  const target = P.active || P.nextFixed;
  if (target && target.loc) pts.push(LOC[target.loc]);
  let vb = [0, 0, 360, 540];
  if (pts.length) {
    let x0 = Math.min(...pts.map(p => p[0])) - 80, x1 = Math.max(...pts.map(p => p[0])) + 80;
    let y0 = Math.min(...pts.map(p => p[1])) - 80, y1 = Math.max(...pts.map(p => p[1])) + 80;
    const ar = w / h; let bw = x1 - x0, bh = y1 - y0;
    if (bw < 280) { x0 -= (280 - bw) / 2; bw = 280; }
    if (bw / bh < ar) { const nw = bh * ar; x0 -= (nw - bw) / 2; bw = nw; } else { const nh = bw / ar; y0 -= (nh - bh) / 2; bh = nh; }
    vb = [x0, y0, bw, bh];
  }
  let g = '';
  if (live() && !P.active) suggestions(m, P.free).slice(0, 6).forEach(x => { if (x.s.loc && LOC[x.s.loc]) { const [a, b] = LOC[x.s.loc]; g += `<circle cx="${a}" cy="${b}" r="6" fill="var(--leg2)" stroke="var(--surface)" stroke-width="2" opacity="${x.snoozed ? .35 : .9}"/>`; } });
  if (S.here && target && target.loc && S.here !== target.loc) g += seg(LOC[S.here], LOC[target.loc], P.active ? 'accent' : (m >= P.leaveAt ? 'accent' : 'muted'), 4);
  if (target && target.loc) { const [x, y] = LOC[target.loc]; g += `<circle cx="${x}" cy="${y}" r="11" fill="var(--accent)" class="pulse"/>` + pill(x, y - 22, `必須 ${target.at}`, 'accent', true); }
  if (S.here && LOC[S.here]) { const [x, y] = LOC[S.here]; g += `<circle cx="${x}" cy="${y}" r="9" fill="var(--ink)" stroke="var(--surface)" stroke-width="3"/>` + pill(x, y + 22, 'いまここ', 'ink', false); }
  return `<svg viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="現在地と次の必須" font-family="-apple-system, Hiragino Sans, sans-serif">${DEFS}${baseMap()}${g}</svg>
    <div class="modes"><button data-mode="eve" aria-pressed="${S.mode === 'eve'}">前日</button><button data-mode="day" aria-pressed="${S.mode === 'day'}">当日</button></div><button class="full" data-goto="map">全体図</button>`;
}

function renderPlan() {
  const m = nowMin();
  const evs = EV[S.mode].filter(e => !e.cond || e.cond() || done.has(e.key));
  const limited = SPOTS[S.mode].filter(s => s.sessions || s.win.length > 1 || s.win.some(([a, b]) => mm(a) > 600 || mm(b) < 960));
  $('v-plan').innerHTML = `<div class="stack">
    <div class="seg" style="grid-template-columns:1fr 1fr"><button data-mode="eve" aria-pressed="${S.mode === 'eve'}">前日 10/31</button><button data-mode="day" aria-pressed="${S.mode === 'day'}">当日 11/1</button></div>
    <h2>必須の予定</h2><p class="lead">この時刻にその場にいる（期限つきはその間に済ませる）。左の四角でチェック</p>
    ${evs.map(e => { const st = live() ? (done.has(e.key) ? '' : m >= mm(e.to) ? 'past' : mm(e.from) <= m ? 'cur' : '') : '';
      return `<div class="row ${st}" aria-checked="${done.has(e.key)}"><button class="tickbtn" role="checkbox" aria-checked="${done.has(e.key)}" data-key="${e.key}"><span class="tick">${TICK}</span></button>
      <div class="rbody"><span class="meta"><span class="t">${esc(e.at)}</span><span class="pill">${esc(placeName(e.loc))}</span>${e.kind === 'task' ? `<span class="tag">${esc(e.from)}〜${esc(e.to)}の間に</span>` : ''}${st === 'cur' ? '<span class="tag">いま</span>' : ''}${st === 'past' ? '<span class="tag ng">撮り逃し</span>' : ''}</span><span class="w">${esc(e.title)}</span>${e.note ? `<span class="n">${fmt(e.note)}</span>` : ''}</div></div>`; }).join('')}
    <h2>時間が限られる体験</h2><p class="lead">この時間を外すと撮れないもの。空き時間に優先して回る</p>
    ${limited.map(s => `<div class="lim${spotDone(s) ? ' isdone' : ''}"><b>${esc(s.name)}</b><span>${esc(placeName(s.loc))}・${s.win.map(([a, b]) => `${a}〜${b}`).join('、')}</span>${s.sessions ? `<span>回：${s.sessions.map(([t, , l]) => `${t}${l === '回' ? '' : l}`).join('、')}</span>` : ''}<span class="hint">${esc(s.hint)}</span></div>`).join('')}
  </div>`;
}

function renderMap() {
  const m = nowMin(), P = plan(m);
  let g = '';
  SPOTS[S.mode].forEach(s => {
    if (!s.loc || !LOC[s.loc]) return;
    const st = spotState(s, m), d = spotDone(s);
    const col = d ? 'done' : !live() ? 'leg2' : st.open ? 'leg2' : st.over ? 'muted' : 'zone-line';
    const [x, y] = LOC[s.loc];
    g += `<g data-pin="${s.id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="16" fill="transparent"/><circle cx="${x}" cy="${y}" r="7" fill="var(--${col})" stroke="var(--surface)" stroke-width="2"/></g>`;
  });
  EV[S.mode].filter(e => e.loc && !done.has(e.key) && (!e.cond || e.cond())).forEach(e => { const [x, y] = LOC[e.loc]; g += pill(x + 18, y - 14, e.at, live() && m >= mm(e.to) ? 'muted' : 'accent', false); });
  if (S.here && LOC[S.here]) { const [x, y] = LOC[S.here]; g += `<circle cx="${x}" cy="${y}" r="9" fill="var(--ink)" stroke="var(--surface)" stroke-width="3"/>`; }
  if (S.here && P.nextFixed && P.nextFixed.loc && S.here !== P.nextFixed.loc) g = seg(LOC[S.here], LOC[P.nextFixed.loc], 'accent', 3.5) + g;
  $('v-map').innerHTML = `<div class="stack">
    <div class="seg" style="grid-template-columns:1fr 1fr"><button data-mode="eve" aria-pressed="${S.mode === 'eve'}">前日 10/31</button><button data-mode="day" aria-pressed="${S.mode === 'day'}">当日 11/1</button></div>
    <div class="mapbox"><svg viewBox="0 0 360 540" role="img" aria-label="会場の地図" font-family="-apple-system, Hiragino Sans, sans-serif">${DEFS}${baseMap()}${g}</svg></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>必須（時刻）</span><span><i style="background:var(--leg2)"></i>いま撮れる</span><span><i style="background:var(--done)"></i>撮影済み</span><span><i style="background:var(--muted)"></i>終了</span><span><i style="background:var(--ink)"></i>いる場所</span></div>
    <p class="lead">点をタップすると、その体験を「いま」の画面で開きます。会場図をもとにした概略図（距離は正確ではない）。</p>
  </div>`;
}

function renderFirms() {
  const m = nowMin(); let html = '';
  SPOTS.day.filter(s => (s.firms || []).length).forEach(s => {
    const fs = s.firms.filter(fi => !(S.onlyOpen && firmDone(fi)));
    if (!fs.length) return;
    const st = spotState(s, m);
    html += `<div class="group-time">${esc(s.name)}<small>${esc(placeName(s.loc))}・${s.win.map(([a, b]) => `${a}〜${b}`).join('、')}${today() === DATE.day || S.sim.on ? (st.over ? '（終了）' : st.open ? '（開催中）' : '') : ''}</small></div>` + fs.map(firmCard).join('');
  });
  const comp = FIRMS.filter((_, i) => firmDone(i)).length;
  $('v-firms').innerHTML = `<div class="stack"><h2>全社チェック</h2>
    <div class="toolbar"><span class="lead">完了 ${comp}/${FIRMS.length}社</span><label class="switch"><input type="checkbox" id="only-open" ${S.onlyOpen ? 'checked' : ''}>未完了だけ</label></div>${html || '<p class="empty">全社そろいました。</p>'}</div>`;
}

function itemBtn(k, text) { return `<button class="item" role="checkbox" aria-checked="${done.has(k)}" data-key="${k}"><span class="tick">${TICK}</span><span>${fmt(text)}</span></button>`; }
function renderPrep() {
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  $('v-prep').innerHTML = `<div class="stack">
    ${standalone ? '' : `<div class="install"><b>全画面で使うには</b>：Safariの共有ボタン（四角に上向き矢印）→「ホーム画面に追加」。ホーム画面のアイコンから開くと全画面になり、閉じても同じ画面に戻ります。</div>`}
    <div class="box setrow"><span>アプリの版</span><b>${VERSION}</b></div>
    <h2>使い方</h2>
    <div class="box"><ul>
      <li><b>赤「今すぐ移動」</b>が出たら、表示された場所へ。着いたら「着いた」</li>
      <li><b>橙「いま必須」</b>はその場で撮る。撮れたら「撮り終えた」</li>
      <li><b>緑「自由に撮れる時間」</b>は、下の候補から子どもがいるところを撮る。候補は終了が近い順・近い場所順に並ぶ</li>
      <li>子どもがいなければ<b>「子どもがいない」</b>で20分保留して次へ</li>
      <li>移動したら下の<b>「いる場所」</b>を変えると、徒歩時間と移動開始の時刻が正確になる（候補でチェックするとその場所に自動で変わる）</li>
    </ul></div>
    <h3>設定</h3>
    <div class="box setrow"><span>移動の余裕</span><span class="stepper"><button data-buffer="-1">−</button><b>${S.buffer}分</b><button data-buffer="1">＋</button></span></div>
    <div class="box"><div class="setrow"><span>リハーサル（時刻を指定して試す）</span><label class="switch"><input type="checkbox" id="sim-on" ${S.sim.on ? 'checked' : ''}>使う</label></div>
      ${S.sim.on ? `<div class="setrow"><span>${S.mode === 'eve' ? '前日' : '当日'} <b>${hhmm(S.sim.min)}</b></span><span class="stepper"><button data-sim="-15">−15</button><button data-sim="-5">−5</button><button data-sim="5">＋5</button><button data-sim="15">＋15</button></span></div>` : ''}
      <p class="lead">リハーサル中のチェックも保存されます。試した後は、予定タブで外してください。</p></div>
    <h2>要点</h2>
    <p class="lead">当日 11/1（日）10:00〜16:00。主催 宍粟市商工会青年部、事務局 <span class="contact">0790-62-2365</span></p>
    <h3>必ず押さえるシーン（前日）</h3>${EV.eve.map(e => itemBtn(e.key, `${e.at} ${e.title}`)).join('')}
    <h3>必ず押さえるシーン（当日）</h3>${EV.day.filter(e => !e.cond || e.cond() || done.has(e.key)).map(e => itemBtn(e.key, `${e.at} ${e.title}`)).join('')}
    <p class="lead">ここのチェックは「いま」画面・予定タブと同じものです。</p>
    <h3>撮らない（NG）</h3><div class="box"><ul class="ng">${NG.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
    <h3>1社の撮り方（3〜5分）</h3><div class="box">会社名（プレート・のぼり・業務服）→ 手元（社員が教える）→ 顔（挑戦する子）→ 笑顔（できた瞬間）→ 一問（社員に「子どもに何を伝えたいか」）。ステージ本編は主催カメラ、自分は袖・客席・表情。</div>
    <h3>GoPro タイムラプス（俯瞰）</h3><div class="box"><ul><li>会場全体が入る高い場所に固定。前日と当日で同じ位置・画角</li><li>インターバル5秒（8時間で約3分の素材）、広角、露出とホワイトバランスを固定</li><li>モバイルバッテリーで給電。点検・回収は「必須の予定」に入っている</li></ul></div>
    <h3>設営中に聞くこと</h3>${ASK.map((t, i) => itemBtn('k' + i, t)).join('')}
    <h3>振り返りインタビュー</h3>${QUESTIONS.map((t, i) => itemBtn('q' + i, t)).join('')}
    <h3>持ち物</h3>${GEAR.map((t, i) => itemBtn('g' + i, t)).join('')}
  </div>`;
}

function renderTop() {
  const m = nowMin();
  $('clock').textContent = hhmm(m);
  const P = plan(m);
  let line = '';
  if (!live()) line = `${S.mode === 'eve' ? '前日' : '当日'}の本番前`;
  else if (P.active) line = `撮影中：<b>${esc(P.active.title)}</b>`;
  else if (P.nextFixed) { const d = mm(P.nextFixed.from) - m; line = `次の必須 <b>${esc(P.nextFixed.at)}</b> ${esc(placeName(P.nextFixed.loc))}（あと${d}分）`; }
  else line = '必須はすべて終了';
  const comp = FIRMS.filter((_, i) => firmDone(i)).length;
  $('topsub').innerHTML = `${line}<br>全社 <b>${comp}/${FIRMS.length}</b>${S.sim.on ? '　<span class="simtag">リハーサル中</span>' : ''}`;
  $('wake').setAttribute('aria-pressed', S.wake);
}

const RENDER = { now: renderNow, plan: renderPlan, map: renderMap, firms: renderFirms, prep: renderPrep };
function render() {
  renderTop();
  RENDER[S.tab]();
  document.querySelectorAll('.view').forEach(v => v.hidden = v.dataset.tab !== S.tab);
  document.querySelectorAll('#tabbar button').forEach(b => b.dataset.tab === S.tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  alertCheck();
}
function scroller(tab) { return tab === 'now' ? $('nowwrap') : $('v-' + tab); }
function rememberScroll() { const el = scroller(S.tab); if (el) { S.scroll[S.tab] = el.scrollTop; persist(); } }
function restoreScroll() { const el = scroller(S.tab); if (el) el.scrollTop = S.scroll[S.tab] || 0; }
function keepScroll(fn) { const el = scroller(S.tab), y = el ? el.scrollTop : 0; fn(); const el2 = scroller(S.tab); if (el2) el2.scrollTop = y; }

// one buzz + toast when it is time to move
function alertCheck() {
  if (!live()) return;
  const m = nowMin(), P = plan(m);
  if (P.nextFixed && m >= P.leaveAt) {
    const k = S.mode + P.nextFixed.key;
    if (!S.warned[k]) { S.warned[k] = 1; persist(); buzz([200, 100, 200]); toast(`移動の時間：${destName(P.nextFixed.loc)}へ（${P.nextFixed.at} ${P.nextFixed.title}）`); }
  }
}

// ================= actions =================
function setTab(tab) { rememberScroll(); S.tab = tab; persist(); render(); restoreScroll(); }
function toggle(k) { if (done.has(k)) done.delete(k); else done.add(k); save(); buzz(); }
const spotById = id => SPOTS[S.mode].find(s => s.id === id) || SPOTS.day.find(s => s.id === id) || SPOTS.eve.find(s => s.id === id);

document.addEventListener('click', e => {
  const pin = e.target.closest('[data-pin]');
  if (pin) { S.open = pin.dataset.pin; S.showAll = true; persist(); setTab('now'); const el = document.querySelector('.spot.open'); if (el) el.scrollIntoView({ block: 'center' }); return; }
  const t = e.target.closest('button, input');
  if (!t) return;
  const d = t.dataset;
  if (t.closest('#tabbar')) return setTab(d.tab);
  if (d.goto) return setTab(d.goto);
  if (d.mode) { S.mode = d.mode; S.open = null; persist(); render(); return; }
  if (d.key) {
    toggle(d.key);
    // ticking a cut at a spot means I am there
    const sp = t.closest('.spot'); if (sp && S.open) { const s = spotById(S.open); if (s && s.loc) S.here = s.loc; }
    persist(); keepScroll(render); return;
  }
  if (d.openSpot) { S.open = S.open === d.openSpot ? null : d.openSpot; persist(); keepScroll(render); return; }
  if (d.openEv) { S.open = S.open === 'ev:' + d.openEv ? null : 'ev:' + d.openEv; persist(); keepScroll(render); return; }
  if (d.snooze) { S.snooze[d.snooze] = nowMin() + 20; S.open = null; persist(); buzz(); toast('20分後にまた候補に出します'); keepScroll(render); return; }
  if (d.spotDone) { const s = spotById(d.spotDone); done.add(spotKey(s)); if (s.loc) S.here = s.loc; S.open = null; save(); persist(); buzz(); toast(`${s.name}：撮影済み`); keepScroll(render); return; }
  if (d.doneEv) { done.add(d.doneEv); const ev = EV[S.mode].find(x => x.key === d.doneEv); if (ev && ev.loc) S.here = ev.loc; save(); persist(); buzz(); toast('撮影済みにしました'); keepScroll(render); return; }
  if (d.skipEv) { S.skip[d.skipEv] = 1; persist(); toast('あきらめた項目は予定タブで確認できます'); keepScroll(render); return; }
  if (d.arrive !== undefined) { if (d.arrive) S.here = d.arrive; persist(); buzz(); toast('到着しました'); keepScroll(render); return; }
  if (d.hereToggle) { S.hereOpen = true; renderHereBar(); return; }
  if (d.here) { S.here = d.here; S.hereOpen = false; persist(); keepScroll(render); return; }
  if (d.toggleMust) { S.showMust = !S.showMust; keepScroll(render); return; }
  if (d.openMust) { S.open = S.open === 'must:' + d.openMust ? null : 'must:' + d.openMust; persist(); keepScroll(render); return; }
  if (d.reload) { location.reload(); return; }
  if (d.toggleMissed) { S.showMissed = !S.showMissed; keepScroll(render); return; }
  if (d.showAll) { S.showAll = true; keepScroll(render); return; }
  if (d.buffer) { S.buffer = Math.max(0, Math.min(15, S.buffer + +d.buffer)); persist(); keepScroll(render); return; }
  if (d.sim) { S.sim.min = Math.max(6 * 60, Math.min(19 * 60, S.sim.min + +d.sim)); persist(); keepScroll(render); return; }
  if (t.id === 'sim-on') { S.sim.on = t.checked; if (S.sim.on && !S.sim.min) S.sim.min = 600; persist(); keepScroll(render); return; }
  if (t.id === 'only-open') { S.onlyOpen = t.checked; persist(); render(); return; }
  if (t.id === 'wake') { S.wake = !S.wake; persist(); applyWake(); renderTop(); toast(S.wake ? '画面を消さない' : '画面は自動で消える'); }
});

// keep the screen on while shooting (where the browser allows it)
let lock = null;
async function applyWake() {
  try {
    if (S.wake && 'wakeLock' in navigator && document.visibilityState === 'visible') { if (!lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } }
    else if (lock) { await lock.release(); lock = null; }
  } catch (e) { lock = null; }
}

['visibilitychange', 'pagehide'].forEach(ev => window.addEventListener(ev, () => {
  if (document.visibilityState === 'hidden' || ev === 'pagehide') { rememberScroll(); persist(); save(); }
  else { keepScroll(render); applyWake(); }
}));
let scrollT;
document.addEventListener('scroll', () => { clearTimeout(scrollT); scrollT = setTimeout(rememberScroll, 300); }, true);
window.addEventListener('resize', () => { if (S.tab === 'now') keepScroll(renderNow); });
setInterval(() => { renderTop(); alertCheck(); if (S.tab === 'now') keepScroll(renderNow); }, 20000);


// tell the user when a newer version is on the server
async function checkUpdate() {
  if (location.protocol !== 'https:') return;
  try {
    const t = await (await fetch('index.html', { cache: 'no-store' })).text();
    const v = (/const VERSION = '([^']+)'/.exec(t) || [])[1];
    const bar = $('updbar');
    if (v && v !== VERSION) { bar.hidden = false; bar.innerHTML = `<button data-reload="1">新しい版（${esc(v)}）があります。タップで更新</button>`; }
  } catch (e) {}
}
checkUpdate();
setInterval(checkUpdate, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
render();
requestAnimationFrame(() => { if (S.tab === 'now') renderNow(); restoreScroll(); });
applyWake();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
