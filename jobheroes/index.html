<!doctype html>
<html lang="ja">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>JH撮影</title>
<style>
/* One-handed field app: map up top (look), card in the middle (read), controls in the bottom third (thumb). */
:root {
  --bg: #eef1f3; --surface: #ffffff; --ink: #121c25; --muted: #56636f; --line: #d3dae0;
  --accent: #d9480f; --accent-ink: #ffffff; --done: #24784a; --done-bg: #e1f1e7;
  --peak: #fff0c7; --peak-line: #e0ac3a; --ng: #a51d1d;
  --leg1: #d9480f; --leg2: #1c64b0; --leg3: #7b3fb5;
  --grass: #e2eede; --water: #cde2f2; --road: #dfe2e5; --zone: #ffffff; --zone-line: #9cb09f; --lot: #eaedf0; --map-ink: #2a3832;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  --tabbar: 58px; --actionbar: 76px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1116; --surface: #151e26; --ink: #e8eef3; --muted: #9aa9b5; --line: #26333e;
    --accent: #ff7a3d; --accent-ink: #1a0b03; --done: #63cf93; --done-bg: #14301f;
    --peak: #362c10; --peak-line: #a17d28; --ng: #ff8d8d;
    --leg1: #ff7a3d; --leg2: #5aa6ee; --leg3: #b98af0;
    --grass: #182820; --water: #142d45; --road: #262c33; --zone: #1b252e; --zone-line: #485e50; --lot: #1f272e; --map-ink: #d3e0d8;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
b { font-weight: 800; }

#app { display: flex; flex-direction: column; height: 100%; }
.top { flex: 0 0 auto; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 6px) max(14px, env(safe-area-inset-right, 0px)) 6px max(14px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px; }
.clock { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.top .sub { font-size: 12px; color: var(--muted); line-height: 1.3; min-width: 0; flex: 1; }
.top .sub b { color: var(--ink); }
.wake { font-size: 12px; font-weight: 700; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 10px; color: var(--muted); white-space: nowrap; }
.wake[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

.views { flex: 1 1 auto; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 12px max(14px, env(safe-area-inset-right, 0px)) 24px max(14px, env(safe-area-inset-left, 0px)); }
.view[hidden], #v-shoot[hidden] { display: none; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* tab bar (bottom, thumb) */
.tabbar { flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.tabbar button { height: var(--tabbar); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tabbar svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

/* shoot view */
#v-shoot { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
.mini { flex: 0 0 auto; height: min(34vh, 270px); background: var(--grass); border-bottom: 1px solid var(--line); position: relative; }
.mini svg { width: 100%; height: 100%; display: block; }
.mini .modes { position: absolute; left: 10px; top: 10px; display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.mini .modes button { font-size: 13px; font-weight: 800; padding: 6px 12px; border-radius: 7px; color: var(--muted); }
.mini .modes button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.mini .full { position: absolute; right: 10px; top: 10px; font-size: 12px; font-weight: 800; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.cardwrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px max(14px, env(safe-area-inset-right, 0px)) 16px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.pos { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 700; }
.pos .bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; align-self: center; }
.pos .bar i { display: block; height: 100%; background: var(--done); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.card.peak { background: var(--peak); border-color: var(--peak-line); }
.card.isdone { background: var(--done-bg); border-color: transparent; }
.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.big-time { font-size: 34px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.pill { font-size: 13px; font-weight: 800; border-radius: 999px; padding: 2px 10px; background: var(--bg); border: 1px solid var(--line); }
.tag { font-size: 12px; font-weight: 800; color: var(--accent); }
.donetag { font-size: 12px; font-weight: 800; color: var(--done); }
.rel { font-size: 13px; font-weight: 700; color: var(--muted); }
.what { font-size: 19px; font-weight: 700; line-height: 1.45; }
.note { font-size: 15px; color: var(--muted); }
.next { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; padding: 0 2px; }
.next b { color: var(--ink); }
.firm { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.firm.complete { background: var(--done-bg); border-color: transparent; }
.firm-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.firm-name { font-weight: 800; font-size: 16px; min-width: 0; }
.firm-what { font-size: 13px; color: var(--muted); font-weight: 400; }
.count { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.firm.complete .count { color: var(--done); }
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.chip { min-height: 48px; font-size: 14px; font-weight: 800; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); }
.chip[aria-checked="true"] { background: var(--done); border-color: var(--done); color: var(--surface); }

.actionbar { flex: 0 0 auto; display: grid; grid-template-columns: 58px 58px 1fr; gap: 8px; padding: 8px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.actionbar button { height: 60px; border-radius: 14px; font-weight: 800; }
.btn-sub { background: var(--bg); border: 1.5px solid var(--line) !important; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.btn-sub svg { width: 22px; height: 22px; }
.btn-main { background: var(--accent); color: var(--accent-ink); font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.btn-main:active { transform: translateY(2px); box-shadow: none; }
.btn-main.nextonly { background: var(--ink); color: var(--surface); }

/* lists */
.seg { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { font-size: 15px; font-weight: 800; padding: 10px 2px; border-radius: 9px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
h2 { font-size: 22px; font-weight: 800; }
h3 { font-size: 13px; letter-spacing: .06em; color: var(--muted); margin-top: 6px; }
.lead { color: var(--muted); font-size: 14px; }
.row { display: grid; grid-template-columns: 52px 1fr; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: left; width: 100%; }
.row.peak { background: var(--peak); border-color: var(--peak-line); }
.row.cur { box-shadow: 0 0 0 3px var(--accent); }
.row[aria-checked="true"] { background: var(--done-bg); border-color: transparent; }
.row .tickbtn { display: grid; place-items: center; border-right: 1px solid var(--line); }
.row[aria-checked="true"] .tickbtn { border-color: transparent; }
.tick { width: 28px; height: 28px; border-radius: 8px; border: 2.5px solid var(--muted); display: grid; place-items: center; }
.tick svg { width: 18px; height: 18px; opacity: 0; }
[aria-checked="true"] > .tickbtn .tick, .item[aria-checked="true"] .tick { background: var(--done); border-color: var(--done); }
[aria-checked="true"] > .tickbtn .tick svg, .item[aria-checked="true"] .tick svg { opacity: 1; }
.row .rbody { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; }
.row .meta { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.row .t { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.row .w { font-size: 15px; }
.row[aria-checked="true"] .w { color: var(--muted); }
.row .n { font-size: 13px; color: var(--muted); }
.item { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: left; width: 100%; font-size: 15px; }
.item[aria-checked="true"] { background: var(--done-bg); border-color: transparent; color: var(--muted); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.box ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.ng li { color: var(--ng); }
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.key { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.key .kt { font-size: 24px; font-weight: 800; color: var(--accent); line-height: 1.2; font-variant-numeric: tabular-nums; }
.key .kd { font-size: 13px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); }
.group-time { font-size: 15px; font-weight: 800; color: var(--muted); margin-top: 6px; }
.empty { text-align: center; color: var(--muted); padding: 16px; }
.contact { user-select: all; -webkit-user-select: all; font-weight: 800; font-variant-numeric: tabular-nums; }

/* full map */
.mapbox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.mapbox svg { width: 100%; height: auto; display: block; }
.legs { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.legs button { display: grid; grid-template-columns: 32px 50px 1fr; gap: 8px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 15px; }
.legs button.cur { box-shadow: 0 0 0 3px var(--accent); }
.legs button[aria-checked="true"] { background: var(--done-bg); border-color: transparent; color: var(--muted); }
.legs .num { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 13px; }
.legs .lt { font-weight: 800; font-variant-numeric: tabular-nums; }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + var(--actionbar) + env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); background: var(--ink); color: var(--surface); font-weight: 800; font-size: 15px; padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; }
.toast.show { opacity: 1; }
.install { background: var(--peak); border: 1px solid var(--peak-line); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.install b { font-weight: 800; }
@keyframes pulse { 0% { r: 12; opacity: .55; } 100% { r: 28; opacity: 0; } }
.pulse { animation: pulse 1.6s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .toast, .btn-main { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="clock" id="clock">--:--</div>
    <div class="sub" id="topsub"></div>
    <button class="wake" id="wake" aria-pressed="false">画面ON</button>
  </header>

  <div class="views">
    <section class="view" id="v-shoot" data-tab="shoot">
      <div class="mini" id="mini"></div>
      <div class="cardwrap" id="cardwrap"></div>
      <div class="actionbar">
        <button class="btn-sub" id="btn-prev" aria-label="前の予定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>前</button>
        <button class="btn-sub" id="btn-now" aria-label="いまの時刻の予定へ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>いま</button>
        <button class="btn-main" id="btn-ok"></button>
      </div>
    </section>
    <section class="view" id="v-list" data-tab="list" hidden></section>
    <section class="view" id="v-map" data-tab="map" hidden></section>
    <section class="view" id="v-firms" data-tab="firms" hidden></section>
    <section class="view" id="v-prep" data-tab="prep" hidden></section>
  </div>

  <nav class="tabbar" id="tabbar">
    <button data-tab="shoot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7l1.5-3h5L16 7"/><circle cx="12" cy="13.5" r="3.5"/></svg>撮影</button>
    <button data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>地図</button>
    <button data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>予定</button>
    <button data-tab="firms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20V9l5-3v14M9 20V4l7 4v12M16 20v-8l4 2v6M3 20h18"/></svg>全社</button>
    <button data-tab="prep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>要点</button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

// ================= data =================
// [time, place, what, note, peak, loc]
const EVE = [
  ['12:20', '—', '雨天判断を青年部HP・Instagramで確認', '正午に決定済み。延期なら11/8に読み替え', 0, null],

  ['13:00', '北 飲食', '飲食ブース設営：テント3張をつなげて一体化（原田さん・岡本さん）', '前日で最初の作業。テントが立ち上がる瞬間', 0, 'inshoku'],

  ['帰宅後', '—', '素材のバックアップ、バッテリー充電、カードの空き確認', '明日は7:30から', 0, null],
];
const DAY = [
  ['7:15', '俯瞰ポイント', '**GoPro設置・タイムラプス開始**（インターバル5秒）', '7:30の搬入から撤収まで1日回す。前日と同じ位置・画角で前後比較', 1, 'gopro'],

const ARW = c => `<marker id="arw-${c}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--${c})"/></marker>`;

  return `<path d="M${a[0]} ${a[1]} L${mx} ${my} L${b[0]} ${b[1]}" fill="none" stroke="var(--${color})" stroke-width="${w}" stroke-linecap="round" marker-mid="url(#arw-${color})" ${extra}/>`;

function pill(x, y, label, color, big) {

// day stops shown on the full map: DAY rows from 10:00 with a location
const STOPS = DAY.map((r, i) => ({ i, t: r[0], l: r[2].replace(/\*\*/g, ''), loc: r[5], m: mins(r[0]) }))
  .filter(s => s.loc && s.m >= 600)

function fullMap(leg) {
  const ss = leg ? STOPS.filter(s => s.leg === leg) : STOPS;
  const startIdx = leg ? STOPS.indexOf(ss[0]) - 1 : -1;
  const path = (startIdx >= 0 ? [STOPS[startIdx], ...ss] : ss);
  let lines = '';
  for (let k = 1; k < path.length; k++) {
    const a = LOC[path[k - 1].loc], b = LOC[path[k].loc];
    if (a[0] === b[0] && a[1] === b[1]) continue;
    lines += seg(a, b, 'leg' + path[k].leg, 3, 'opacity=".9"');
  }
  const groups = new Map();
  ss.forEach(s => { const k = s.loc; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); });
  const cur = S.mode === 'day' ? S.ptr.day : -1;
  let pins = '';
  groups.forEach((list, loc) => {
    const [x, y] = LOC[loc];
    const label = list.length > 3 ? `${list[0].n}…${list[list.length - 1].n}` : list.map(s => s.n).join('·');
    const isCur = list.some(s => s.i === cur);
    if (isCur) pins += `<circle cx="${x}" cy="${y}" r="12" fill="var(--accent)" class="pulse"/>`;
    pins += pill(x, y, label, isCur ? 'accent' : 'leg' + list[list.length - 1].leg, false);

}

// mini map on the shoot screen: zooms to the move from the current stop to the next
function miniMap(rows, i, w, h) {
  const curLoc = rows[i] && rows[i][5];
  let ni = i + 1; while (ni < rows.length && !rows[ni][5]) ni++;
  const nextLoc = ni < rows.length ? rows[ni][5] : null;
  let pi = i - 1; while (pi >= 0 && !rows[pi][5]) pi--;
  const prevLoc = pi >= 0 ? rows[pi][5] : null;
  const pts = [curLoc, nextLoc].filter(Boolean).map(l => LOC[l]);
  let vb;
  if (!pts.length) vb = [0, 0, 360, 540];
  else {
    let x0 = Math.min(...pts.map(p => p[0])), x1 = Math.max(...pts.map(p => p[0]));
    let y0 = Math.min(...pts.map(p => p[1])), y1 = Math.max(...pts.map(p => p[1]));
    const pad = 70; x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
    const ar = w / h; let bw = x1 - x0, bh = y1 - y0;
    if (bw < 260) { x0 -= (260 - bw) / 2; bw = 260; }
    if (bh < 260 / ar) { y0 -= (260 / ar - bh) / 2; bh = 260 / ar; }
    if (bw / bh < ar) { const nw = bh * ar; x0 -= (nw - bw) / 2; bw = nw; } else { const nh = bw / ar; y0 -= (nh - bh) / 2; bh = nh; }
    vb = [x0, y0, bw, bh];
  }
  let g = '';
  if (prevLoc && curLoc && prevLoc !== curLoc) g += seg(LOC[prevLoc], LOC[curLoc], 'muted', 2.5, 'opacity=".55" stroke-dasharray="4 4"');
  if (curLoc && nextLoc && curLoc !== nextLoc) g += seg(LOC[curLoc], LOC[nextLoc], 'accent', 4.5);
  // dots on the exact spots, labels pushed apart so they never cover each other
  const below = curLoc && nextLoc && LOC[nextLoc][1] >= LOC[curLoc][1];
  if (nextLoc && nextLoc !== curLoc) { const [x, y] = LOC[nextLoc], dy = below ? 24 : -24; g += `<circle cx="${x}" cy="${y}" r="6" fill="var(--leg2)" stroke="var(--surface)" stroke-width="2"/>` + pill(x, y + dy, '次 ' + rows[ni][0], 'leg2', true); }
  if (curLoc) { const [x, y] = LOC[curLoc], dy = below ? -24 : 24; g += `<circle cx="${x}" cy="${y}" r="10" fill="var(--accent)" class="pulse"/><circle cx="${x}" cy="${y}" r="7" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>` + pill(x, y + dy, 'いま ' + rows[i][0], 'accent', true); }
  const allNote = !curLoc ? `<text x="180" y="270" font-size="16" font-weight="800" text-anchor="middle" fill="var(--map-ink)">会場全域</text>` : '';
  return `<svg viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="現在地と次の移動先" font-family="-apple-system, Hiragino Sans, sans-serif">${DEFS}${baseMap()}${g}${allNote}</svg>`;
}

const RENDER = { shoot: renderShoot, list: renderList, map: renderMap, firms: renderFirms, prep: renderPrep };

function scroller(tab) { return tab === 'shoot' ? $('cardwrap') : $('v-' + tab); }
function rememberScroll() { const el = scroller(S.tab); if (el) { S.scroll[S.tab] = el.scrollTop; persist(); } }
function restoreScroll() { const el = scroller(S.tab); if (el) el.scrollTop = S.scroll[S.tab] || 0; }

// ================= actions =================
function setTab(tab) { rememberScroll(); S.tab = tab; persist(); render(); restoreScroll(); }
function toggle(k) { if (done.has(k)) done.delete(k); else done.add(k); save(); buzz(); }
function nowIndex(mode) {
  const rows = rowsOf(mode), t = jst(), m = t.h * 60 + t.mi;
  let idx = 0; rows.forEach((r, i) => { const v = mins(r[0]); if (v !== null && v <= m) idx = i; });
  return idx;
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, input');
  if (!t) return;
  if (t.closest('#tabbar')) return setTab(t.dataset.tab);
  if (t.dataset.goto) return setTab(t.dataset.goto);
  if (t.dataset.mode) { S.mode = t.dataset.mode; persist(); render(); return; }
  if (t.dataset.leg !== undefined) { S.leg = +t.dataset.leg; persist(); render(); return; }
  if (t.dataset.key) { toggle(t.dataset.key); const y = scroller(S.tab).scrollTop; render(); scroller(S.tab).scrollTop = y; return; }
  if (t.dataset.open !== undefined) { S.ptr[S.mode] = +t.dataset.open; S.scroll.shoot = 0; setTab('shoot'); return; }
  if (t.dataset.openDay !== undefined) { S.mode = 'day'; S.ptr.day = +t.dataset.openDay; S.scroll.shoot = 0; setTab('shoot'); return; }
  if (t.id === 'only-open') { S.onlyOpen = t.checked; persist(); render(); return; }
  if (t.id === 'btn-ok') {
    const rows = rowsOf(S.mode), i = S.ptr[S.mode], k = keyOf(S.mode, i);
    if (!done.has(k)) { done.add(k); save(); buzz(); toast(`${rows[i][0]} 撮影済み`); }

  }
  if (t.id === 'btn-prev') { S.ptr[S.mode] = Math.max(0, S.ptr[S.mode] - 1); S.scroll.shoot = 0; persist(); render(); $('cardwrap').scrollTop = 0; return; }
  if (t.id === 'btn-now') {

    if (d === 20261031) S.mode = 'eve'; else if (d === 20261101) S.mode = 'day';
    S.ptr[S.mode] = nowIndex(S.mode); persist(); render(); $('cardwrap').scrollTop = 0;

    return;

$('cardwrap').addEventListener('click', e => {
  if (e.target.closest('button')) return;
  const card = e.target.closest('.card'); if (!card) return;
  const k = keyOf(S.mode, S.ptr[S.mode]);
  if (done.has(k)) { done.delete(k); save(); buzz(); toast('チェックを外しました'); render(); }
});

// keep the screen on while shooting (where the browser allows it)
let lock = null;
async function applyWake() {
  try {
    if (S.wake && 'wakeLock' in navigator && document.visibilityState === 'visible') { if (!lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } }
    else if (lock) { await lock.release(); lock = null; }
  } catch (e) { lock = null; }
}

// save the exact screen whenever the app goes to the background
['visibilitychange', 'pagehide'].forEach(ev => window.addEventListener(ev, () => {
  if (document.visibilityState === 'hidden' || ev === 'pagehide') { rememberScroll(); persist(); save(); }
  else { render(); restoreScroll(); applyWake(); }
}));
let scrollT;
document.addEventListener('scroll', () => { clearTimeout(scrollT); scrollT = setTimeout(rememberScroll, 300); }, true);
window.addEventListener('resize', () => { if (S.tab === 'shoot') renderShoot(); });
setInterval(() => { renderTop(); if (S.tab === 'shoot') { const y = $('cardwrap').scrollTop; renderShoot(); $('cardwrap').scrollTop = y; } }, 30000);

render();
requestAnimationFrame(() => { if (S.tab === 'shoot') renderShoot(); restoreScroll(); });
applyWake();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
