<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="キネコマ">
<meta name="theme-color" content="#111215">
<meta name="description" content="台本・香盤表・資料を読み込んで、撮影チェックシートと編集用のスクリプトシートを作る短編映画の現場アプリ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>キネコマ</title>
<style>
:root {
  --bg: #e9e6df; --surface: #fffdf8; --surface2: #f3f0e9; --ink: #16161a; --muted: #6a655c; --line: #dcd7cc;
  --accent: #b35d00; --accent-ink: #ffffff; --accent-bg: #f6e6cf;
  --ok: #1d7a4a; --ok-bg: #dff0e5; --keep: #8a5d00; --keep-bg: #f7ebcf; --ng: #6a6f76; --ng-bg: #e9e7e2;
  --sel: #16161a; --sel-ink: #f3efe6; --warn: #c23a2b; --rec: #d93a2b;
  --film: #111215; --film2: #1b1d22; --film-ink: #ece8df; --film-mute: #9aa0a8; --hole: #e9e6df; --amber: #f2a93b;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
  --mono: ui-monospace, "SF Mono", "Menlo", "Roboto Mono", "Noto Sans Mono", "Consolas", monospace;
  --tabbar: 58px; --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0c; --surface: #141417; --surface2: #1c1c20; --ink: #f1ece2; --muted: #918c83; --line: #2a2a30;
    --accent: #f2a93b; --accent-ink: #1a1105; --accent-bg: #2c2111;
    --ok: #6fd39b; --ok-bg: #102419; --keep: #f2c14e; --keep-bg: #2b230e; --ng: #9a9ca2; --ng-bg: #222327;
    --sel: #f1ece2; --sel-ink: #141417; --warn: #ff6a57; --rec: #ff4b3e;
    --film: #000000; --film2: #121317; --film-ink: #ece8df; --film-mute: #8f959d; --hole: #2d2f35; --amber: #f2a93b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0a0a0c; --surface: #141417; --surface2: #1c1c20; --ink: #f1ece2; --muted: #918c83; --line: #2a2a30;
    --accent: #f2a93b; --accent-ink: #1a1105; --accent-bg: #2c2111;
    --ok: #6fd39b; --ok-bg: #102419; --keep: #f2c14e; --keep-bg: #2b230e; --ng: #9a9ca2; --ng-bg: #222327;
    --sel: #f1ece2; --sel-ink: #141417; --warn: #ff6a57; --rec: #ff4b3e;
    --film: #000000; --film2: #121317; --film-ink: #ece8df; --film-mute: #8f959d; --hole: #2d2f35; --amber: #f2a93b;
    color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
/* 上のぼやけ対策（キューシートと同じ作り）：ページの地・上の帯・theme-color を同じ黒の無地にそろえる。上の帯をグラデーションや透ける色にしない */
html { background-color: #111215; }
body { background: #111215; color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; touch-action: manipulation; text-align: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
b { font-weight: 800; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; background-color: var(--bg); }
.top { flex: 0 0 auto; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.top .ttl { flex: 1; min-width: 0; font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .ttl small { font-weight: 700; color: var(--muted); font-size: 12px; margin-right: 6px; }
.clock { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
#workbar button { display: block; width: 100%; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 14px; padding: 10px; text-align: center; }
#updbar button { display: block; width: 100%; background: var(--ink); color: var(--surface); font-weight: 800; font-size: 14px; padding: 10px; text-align: center; }

.views { flex: 1 1 auto; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

.tabbar { flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) var(--sab) env(safe-area-inset-left, 0px); }
.tabbar button { height: var(--tabbar); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; }
.tabbar svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.flat { background: var(--surface2); }
h2 { font-size: 20px; font-weight: 800; line-height: 1.3; }
h3 { font-size: 13px; font-weight: 800; letter-spacing: .05em; color: var(--muted); }
.lead { color: var(--muted); font-size: 14px; }
.small { font-size: 13px; color: var(--muted); }
.row-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-h > .grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 14px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 800; font-size: 15px; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--sel); border-color: var(--sel); color: var(--sel-ink); }
.btn.small { min-height: 36px; padding: 4px 10px; font-size: 13px; border-radius: 9px; }
.btn.danger { color: var(--warn); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns.grid2 { display: grid; grid-template-columns: 1fr 1fr; }
.link { color: var(--accent); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { font-size: 14px; font-weight: 800; padding: 9px 4px; border-radius: 9px; color: var(--muted); text-align: center; }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 800; color: var(--muted); }
.field input, .field select, .field textarea, .inp { width: 100%; min-height: 44px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 10px; font-size: 16px; }
.field textarea, textarea.inp { min-height: 76px; resize: vertical; line-height: 1.5; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.fields .full { grid-column: 1 / -1; }

.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px dashed var(--line); border-radius: 14px; padding: 22px 12px; text-align: center; cursor: pointer; background: var(--surface2); }
.drop b { font-size: 18px; color: var(--accent); }
.drop.over { border-color: var(--accent); background: var(--accent-bg); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 4px 11px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 700; }
.chip .tk { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-grid; place-items: center; flex: 0 0 auto; }
.chip[aria-checked="true"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.chip[aria-checked="true"] .tk { background: var(--ok); border-color: var(--ok); }
.chip[aria-checked="true"] .tk::after { content: ''; width: 7px; height: 4px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.chip.sel, .chip[aria-pressed="true"] { background: var(--sel); border-color: var(--sel); color: var(--sel-ink); }
.chip.okc { border-color: var(--ok); color: var(--ok); }
.chip.dash { border-style: dashed; color: var(--muted); }
.lbl { font-size: 12px; font-weight: 800; color: var(--muted); margin-right: 2px; }

.badge { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 1px 7px; background: var(--surface2); border: 1px solid var(--line); white-space: nowrap; }
.badge.ok, .r-OK { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.badge.keep, .r-KEEP { background: var(--keep-bg); color: var(--keep); border-color: transparent; }
.badge.ng, .r-NG { background: var(--ng-bg); color: var(--ng); border-color: transparent; }
.badge.warn { background: var(--accent-bg); color: var(--warn); border-color: transparent; }

/* scene rows */
.list { display: flex; flex-direction: column; gap: 8px; }
.srow { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; }
.srow .no { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.srow .no small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
.srow .t { font-weight: 800; min-width: 0; }
.srow .m { font-size: 13px; color: var(--muted); }
.srow.done { background: var(--ok-bg); border-color: transparent; }
.ev { display: flex; gap: 10px; align-items: center; padding: 6px 12px; font-size: 14px; color: var(--muted); font-weight: 700; border-left: 3px solid var(--line); margin-left: 8px; }
.ev b { color: var(--ink); font-variant-numeric: tabular-nums; }
.dayhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.dayhead h2 { font-size: 18px; }
.mv { display: flex; flex-direction: column; gap: 2px; }
.mv button { width: 34px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface2); font-size: 13px; font-weight: 800; text-align: center; }
.dnd { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }

/* matrix */
.mx-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table.mx { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.mx th, .mx td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 6px 8px; text-align: center; white-space: nowrap; }
.mx th { background: var(--surface2); font-weight: 800; position: sticky; top: 0; }
.mx td.l, .mx th.l { text-align: left; }
.mx .on { color: var(--accent); font-weight: 800; }
.mx .sticky { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.mx th.sticky { background: var(--surface2); z-index: 2; }

/* shoot */
.daychips { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
.daychips .chip { white-space: nowrap; flex: 0 0 auto; }
.sum { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.sum div { background: var(--surface2); border-radius: 10px; padding: 8px 10px; }
.sum b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.sum span { font-size: 12px; color: var(--muted); font-weight: 700; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.scard.now { box-shadow: 0 0 0 3px var(--accent); border-color: transparent; }
.scard.done { background: var(--ok-bg); border-color: transparent; }
.scard .hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.scard .tm { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.scard .sn { font-size: 20px; font-weight: 800; }
.scard .pl { font-size: 18px; font-weight: 800; }
.scard .sm { font-size: 15px; }
.cutline { display: flex; flex-wrap: wrap; gap: 6px; }
.cutpill { font-size: 13px; font-weight: 800; border-radius: 8px; padding: 3px 8px; border: 1.5px solid var(--line); background: var(--surface); }
.cutpill.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.cutpill.tried { border-color: var(--keep); color: var(--keep); }
.donebtn { margin-left: auto; }
.fig { display: block; width: 100%; max-width: 420px; height: auto; margin: 4px auto; font-family: var(--font); }
.fig .fbg { fill: var(--surface); stroke: var(--line); stroke-width: .4; }
.fig .froad { fill: var(--surface2); stroke: var(--line); stroke-width: .4; }
.fig .fbox { fill: var(--ng-bg); stroke: var(--ng); stroke-width: .4; }
.fig .fstep { stroke: var(--ng); stroke-width: .3; }
.fig .fsteparrow { stroke: var(--muted); stroke-width: .7; }
.fig .ftree { fill: var(--ok-bg); stroke: var(--ok); stroke-width: .3; }
.fig .fwall { stroke: var(--ink); stroke-width: 1.6; }
.fig .ft { fill: var(--muted); font-size: 3.4px; font-weight: 700; }
.fig .fs { font-size: 3px; }
.fig .fv { font-size: 3.2px; }
.fig .fl { fill: var(--ink); font-size: 3.6px; }
.fig .fan { fill: var(--ok); font-size: 3.2px; font-weight: 800; }
.fig .fcl { fill: var(--accent); font-size: 3.2px; font-weight: 800; }
.fig .fnote { fill: var(--muted); font-size: 3.2px; }
.fig .faxt { fill: var(--warn); font-size: 2.8px; }
.fig .fside { fill: var(--accent); fill-opacity: .07; }
.fig .faxis { stroke: var(--warn); stroke-width: .6; stroke-dasharray: 2 1.4; }
.fig .ffov { fill: var(--accent); fill-opacity: .16; stroke: var(--accent); stroke-width: .35; }
.fig .fcam { fill: var(--ink); }
.fig .fca { fill: var(--accent); }
.fig .fpa { fill: var(--ok); }
.fig .fpan, .fig .fcampath { fill: none; stroke: var(--accent); stroke-width: .6; }
.fig .fcampath { stroke-dasharray: 1.6 1; }
.fig .fpath { fill: none; stroke: var(--ok); stroke-width: .7; stroke-dasharray: 2 1; }
.fig .fface { stroke: var(--ok); stroke-width: .7; }
.fig .fact { fill: var(--ok); }
.fig .fnorth { stroke: var(--ink); stroke-width: .6; }
.fig .fground { stroke: var(--muted); stroke-width: .5; }
.fig .fperson { stroke: var(--ok); stroke-width: .8; fill: var(--ok); }
.figthumb { display: flex; align-items: center; gap: 8px; margin: 4px 0; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); width: 100%; text-align: left; font-size: 13px; font-weight: 800; color: var(--accent); }
.figthumb .fig { width: 120px; flex: 0 0 120px; margin: 0; }
.figbtn { display: block; width: 100%; padding: 0; border-radius: 10px; }
.docv .bfig .fig, #print .bfig .fig { width: 46mm; max-width: 46mm; margin: 1mm 0; }
.alts { margin-top: 3px; }
.alts > summary { font-size: 13px; font-weight: 700; color: var(--accent); min-height: 32px; }
.cam.alt b { color: var(--accent); }
.cam .when { display: inline-block; font-size: 12px; font-weight: 800; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin-right: 4px; }
.planchips .chip { flex-direction: column; align-items: flex-start; gap: 0; line-height: 1.2; padding: 5px 10px; }
.planchips .chip .small { font-size: 11px; font-weight: 700; }
.planchips .chip[aria-pressed="true"] .small { color: var(--sel-ink); }
.cutcam .full { grid-column: 1 / -1; }
.cam { margin-top: 3px; font-size: 13px; background: var(--surface2); border-radius: 8px; padding: 6px 8px; }
.cam b { font-size: 12px; color: var(--muted); margin-right: 4px; }
.cam .why { color: var(--muted); margin-top: 2px; }
.basis { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; }
.basis > span { font-size: 11px; font-weight: 800; color: var(--muted); }
.basis button { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.prin > summary { font-size: 15px; }
.prin .pd { font-size: 14px; margin: 6px 0; }
.prin .pd > b { display: block; font-size: 12px; color: var(--muted); }
.srcs { margin-left: 1.1em; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.srcs a { color: var(--accent); word-break: break-word; }
.gitem { border-top: 1px solid var(--line); padding-top: 4px; }
.gitem:first-of-type { border-top: 0; }
.docv .bref, #print .bref { margin: 2mm 0 3mm; font-size: 13px; }
#print .bref { font-size: 9pt; }
.mm { margin-top: 3px; font-size: 13px; }
.mm b { color: var(--accent); font-size: 13px; margin-right: 0; }
.memo .mm { margin: 4px 0 2px; }
.camd > summary { font-size: 14px; color: var(--accent); }
.camd .cutlist { margin-top: 6px; }
.cutcam { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: -2px 0 6px; }
.cutcam textarea { min-height: 56px; font-size: 14px; }
@media (max-width: 520px) { .cutcam { grid-template-columns: 1fr; } }
.cutlist { display: flex; flex-direction: column; gap: 5px; }
.cutrowv { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; font-size: 14px; }
.cutrowv .cutpill { min-width: 46px; text-align: center; }
.donebtn[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }

/* take rows */
.takes { display: flex; flex-direction: column; gap: 6px; }
.take { display: grid; grid-template-columns: auto auto 1fr auto; gap: 8px; align-items: center; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; text-align: left; font-size: 14px; }
.take .ct { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.take .inf { min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.take .inf b { color: var(--ink); }
.take .sec { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--muted); font-size: 13px; }
.grp { display: flex; flex-direction: column; gap: 6px; }
.grp-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 4px 2px; }
.grp-h .sn { font-size: 18px; font-weight: 800; }
.memo { font-size: 13px; background: var(--surface2); border-radius: 8px; padding: 6px 10px; }
.memo b { color: var(--muted); font-size: 12px; margin-right: 4px; }

/* sheets */
#sheets .sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
.sheet-top { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
.sheet-top .t { flex: 1; min-width: 0; font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(var(--sab) + 40px) max(16px, env(safe-area-inset-left, 0px)); }
.x { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 22px; font-weight: 800; border: 1.5px solid var(--line); text-align: center; }

/* recorder */
.rec-top { display: flex; flex-direction: column; gap: 10px; }
.timer { font-size: 54px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; line-height: 1.05; letter-spacing: .02em; }
.timer.run { color: var(--accent); }
.ctlabel { text-align: center; font-weight: 800; font-size: 20px; }
.ctlabel small { color: var(--muted); font-size: 14px; }
.bigbtn { width: 100%; min-height: 64px; border-radius: 14px; font-size: 22px; font-weight: 800; text-align: center; background: var(--sel); color: var(--sel-ink); box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.bigbtn.run { background: var(--accent); color: var(--accent-ink); }
.bigbtn:active { transform: translateY(2px); box-shadow: none; }
.results { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
.results button { min-height: 60px; border-radius: 14px; font-size: 20px; font-weight: 800; text-align: center; border: 2px solid transparent; }
.results .rOK { background: var(--ok); color: var(--surface); }
.results .rKEEP { background: var(--keep-bg); color: var(--keep); border-color: var(--keep); }
.results .rNG { background: var(--ng-bg); color: var(--ink); border-color: var(--line); }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.notechips { display: flex; flex-wrap: wrap; gap: 5px; }
.notechips button { font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface2); }

/* script lines */
.script { font-size: 15px; line-height: 1.7; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.script .a { color: var(--muted); padding-left: 1.5em; }
.script .d b { margin-right: 2px; }
details > summary { cursor: pointer; font-weight: 800; list-style: none; display: flex; align-items: center; gap: 6px; min-height: 36px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: '▶'; font-size: 11px; color: var(--muted); transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
pre.doc { white-space: pre-wrap; word-break: break-word; font-family: var(--font); font-size: 14px; line-height: 1.6; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }

/* preview mapping */
.maprow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
.maprow:last-child { border-bottom: 0; }
.maprow .h { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.maprow .h small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.maprow select { min-height: 38px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--surface); padding: 4px 6px; font-size: 14px; width: 100%; }
.res { background: var(--surface2); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.res li { margin-left: 1.2em; }
.err { color: var(--warn); font-weight: 700; font-size: 14px; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 8px; }
.steps li { list-style: none; display: grid; grid-template-columns: 28px 1fr; gap: 8px; font-size: 14px; }
.steps li::before { counter-increment: s; content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--sel); color: var(--sel-ink); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14px; }
.cutrow { display: grid; grid-template-columns: 64px 110px 1fr 40px; gap: 6px; align-items: center; }
.cutrow input { min-height: 40px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--surface); padding: 6px 8px; font-size: 15px; width: 100%; min-width: 0; }
@media (max-width: 420px) { .cutrow { grid-template-columns: 52px 84px 1fr 36px; } }

.docv { display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 1.55; }
.docv .pg { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.docv h1 { font-size: 20px; font-weight: 800; line-height: 1.3; }
.docv h1 small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.docv h2 { font-size: 16px; font-weight: 800; margin-top: 6px; }
.docv .ph { color: var(--muted); font-size: 13px; }
.docv .foot { font-size: 12px; color: var(--muted); }
.docv .tblw { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 10px; }
.docv table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 13px; }
.docv td { max-width: 15em; min-width: 3em; }
.docv table.kv { width: 100%; }
.docv table.kv td, .docv .scn table td:last-child { max-width: none; }
.docv th, .docv td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.docv th { background: var(--surface2); font-weight: 800; white-space: nowrap; }
.docv tr > :last-child { border-right: 0; }
.docv .c { text-align: center; }
.docv .sh td { background: var(--surface2); font-weight: 700; }
.docv .evr td { color: var(--muted); font-weight: 700; }
.docv .pm td { font-size: 12px; color: var(--muted); }
.docv .ok { color: var(--ok); font-weight: 800; }
.docv .ng { color: var(--ng); }
.docv .dir { font-size: 12px; color: var(--muted); margin-top: 4px; }
.docv .box { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--muted); border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.docv table.kv th { width: 72px; text-align: center; }
.docv .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.docv .imgs figure { margin: 0; cursor: zoom-in; }
.docv .imgs img { width: 100%; height: 150px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 8px; display: block; }
.docv .imgs figcaption { font-size: 11px; color: var(--muted); margin-top: 2px; }
.docv .scr { font-size: 14px; line-height: 1.7; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.docv .scr .a { color: var(--muted); padding-left: 1.2em; }
.docv .gear { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px; }
.docv .gear b { grid-column: 1 / -1; }
.docv .rules ul { margin-left: 1.2em; }
.thumbs { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
.thumb { flex: 0 0 auto; padding: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
.thumb img { display: block; height: 64px; width: auto; }
.thumbs.big .thumb img { height: 110px; }
.tw { position: relative; flex: 0 0 auto; display: inline-block; }
.tx { position: absolute; top: 2px; right: 2px; width: 28px !important; height: 28px !important; font-size: 15px !important; background: var(--surface); }
.pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.pk { display: flex; flex-direction: column; gap: 4px; border: 2px solid var(--line); border-radius: 10px; padding: 4px; background: var(--surface); text-align: center; font-size: 12px; font-weight: 700; }
.pk img { width: 100%; height: 120px; object-fit: contain; background: #fff; border-radius: 6px; }
.pk[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
#toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + var(--sab) + 14px); transform: translateX(-50%) translateY(20px); background: var(--sel); color: var(--sel-ink); font-weight: 800; font-size: 14px; padding: 10px 16px; border-radius: 12px; opacity: 0; pointer-events: none; transition: .2s; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%); }
#busy { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 70; display: grid; place-items: center; }
#busy div { background: var(--surface); padding: 16px 20px; border-radius: 14px; font-weight: 800; }

/* print */
#print { display: none; }
@media print {
  html, body { height: auto; background: #fff; color: #000; }
  #app, #sheets, #toast, #busy { display: none !important; }
  #print { display: block; font-family: var(--font); font-size: 9.5pt; line-height: 1.4; color: #000; }
  #print .pg { page-break-after: always; }
  #print .pg:last-child { page-break-after: auto; }
  #print h1 { font-size: 15pt; margin-bottom: 2mm; }
  #print h1 small { font-size: 10pt; font-weight: 400; margin-left: 4mm; }
  #print .ph { font-size: 10pt; margin-bottom: 3mm; }
  #print table { width: 100%; border-collapse: collapse; }
  #print th, #print td { border: .6pt solid #000; padding: 1.2mm 1.6mm; vertical-align: top; text-align: left; }
  #print th { background: #e6e6e6; font-weight: 700; white-space: nowrap; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #print tr { page-break-inside: avoid; }
  #print .sh td { background: #f0f0f0; font-weight: 700; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #print .evr td { color: #444; font-style: normal; background: #fafafa; }
  #print .c { text-align: center; }
  #print .box { display: inline-block; width: 3.2mm; height: 3.2mm; border: .7pt solid #000; vertical-align: -0.5mm; margin-right: 1mm; }
  #print .ok { font-weight: 800; }
  #print .ng { color: #555; }
  #print .gear { margin-top: 4mm; columns: 2; }
  #print .gear div { break-inside: avoid; }
  #print .foot { margin-top: 3mm; font-size: 8pt; color: #444; }
  #print .dir { font-size: 8pt; color: #333; margin-top: 1mm; }
  #print .pm td { font-size: 8pt; color: #222; }
  #print .rules { margin-top: 3mm; font-size: 9pt; }
  #print .rules ul { margin-left: 5mm; }
  #print h2 { font-size: 11.5pt; margin: 4mm 0 1.5mm; }
  #print .scn { page-break-before: always; }
  #print table.kv th { width: 18mm; text-align: center; vertical-align: top; }
  #print .imgs { display: flex; flex-wrap: wrap; gap: 3mm; }
  #print .imgs figure { width: calc(33.3% - 2mm); margin: 0; break-inside: avoid; }
  #print .imgs img { display: block; width: 100%; max-height: 62mm; object-fit: contain; border: .5pt solid #999; background: #fff; }
  #print .imgs figcaption { font-size: 7.5pt; color: #444; margin-top: .8mm; }
  #print .scn { font-size: 9pt; }
  #print .scr { font-size: 8.5pt; line-height: 1.45; border: .5pt solid #999; padding: 2mm 3mm; }
  #print .scr .a { color: #333; padding-left: 4mm; }
}

/* ═════ キネコマのデザイン（第2版）：暗い映写室・フィルム・カチンコ ═════ */
@font-face { font-family: "Bebas Neue"; src: url(lib/fonts/bebas-neue.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(lib/fonts/jetbrains-mono-500.woff2) format("woff2"); font-weight: 400 500; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(lib/fonts/jetbrains-mono-700.woff2) format("woff2"); font-weight: 600 800; font-display: swap; }
:root { --display: "Bebas Neue", var(--font); --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --glow: rgba(178,97,12,.10); --card-hi: rgba(255,255,255,.7); --shadow: 0 1px 2px rgba(20,16,8,.06), 0 6px 18px rgba(20,16,8,.06); }
:root[data-theme="dark"] { --glow: rgba(242,169,59,.10); --card-hi: rgba(255,255,255,.035); --shadow: 0 1px 0 rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --glow: rgba(242,169,59,.10); --card-hi: rgba(255,255,255,.035); --shadow: 0 1px 0 rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45); } }

#app { background: radial-gradient(120% 60% at 50% 0%, var(--glow), transparent 60%), var(--grain), var(--bg); }
.views { background: transparent; }

/* 上と下の帯：フィルム */
.perf-b, .perf-t { position: relative; }
.perf-b::after, .perf-t::before { content: ''; position: absolute; left: 0; right: 0; height: 6px; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 7px, var(--hole2) 7px 15px, transparent 15px 22px); border-radius: 1px; }
.perf-b::after { bottom: 5px; }
.perf-t::before { top: 5px; }
:root { --hole2: #2d2f35; }
.top { background: #111215; color: var(--film-ink); border-bottom: 0; padding-bottom: 19px; gap: 10px; box-shadow: 0 1px 0 #000; }
.logo { display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto; color: var(--film-ink); }
.logo svg { width: 26px; height: 26px; filter: drop-shadow(0 0 6px rgba(242,169,59,.35)); }
.logo b { font-size: 16px; font-weight: 900; letter-spacing: .2em; }
.logo small { font-family: var(--mono); font-size: 10px; color: #7c8087; letter-spacing: .04em; align-self: flex-end; margin-bottom: 2px; }
.top .ttl { font-size: 13px; font-weight: 700; color: #8d9198; border-left: 1px solid #2f3238; padding-left: 10px; }
.top .ttl small { display: none; }
.clock { font-family: var(--display); font-size: 30px; font-weight: 400; color: #f2a93b; letter-spacing: .04em; line-height: 1; text-shadow: 0 0 14px rgba(242,169,59,.45); }
.top #helpbtn { background: transparent; color: #d9d4ca; border: 1px solid #33363c; min-height: 34px; border-radius: 999px; padding: 4px 12px; }
.tabbar { background: #111215; border-top: 0; padding-top: 12px; box-shadow: 0 -1px 0 #000; }
.tabbar button { color: #6f747b; position: relative; letter-spacing: .08em; font-size: 11px; }
.tabbar button svg { transition: transform .15s; }
.tabbar button[aria-current="page"] { color: #f2a93b; }
.tabbar button[aria-current="page"] svg { filter: drop-shadow(0 0 6px rgba(242,169,59,.6)); transform: translateY(-1px); }
.tabbar button[aria-current="page"]::after { content: ''; position: absolute; top: 2px; left: 38%; right: 38%; height: 2px; border-radius: 2px; background: #f2a93b; box-shadow: 0 0 8px #f2a93b; }
.sheet-top { background: #111215; color: var(--film-ink); border-bottom: 0; padding-bottom: 17px; }
.sheet-top .t { letter-spacing: .04em; }
.sheet-top .x { color: #d9d4ca; border: 1px solid #33363c; border-radius: 999px; width: 40px; height: 40px; font-size: 18px; }
.sheet-top .btn { background: transparent; color: #d9d4ca; border: 1px solid #33363c; border-radius: 999px; }
.sheet-top .btn.primary { background: #f2a93b; border-color: #f2a93b; color: #1a1105; }
.sheet-top .donebtn[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #06150c; }
#workbar button { background: #f2a93b; color: #1a1105; letter-spacing: .02em; }
#updbar button { background: #1b1d22; color: var(--film-ink); }

/* 文字 */
h2 { font-size: 19px; letter-spacing: .03em; }
h3 { font-size: 12px; letter-spacing: .16em; }
.card > h2:first-child, .card > .row-h:first-child > h2 { display: flex; align-items: center; gap: 9px; }
.card > h2:first-child::before, .card > .row-h:first-child > h2::before { content: ''; flex: 0 0 auto; width: 9px; height: 14px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px var(--glow); }
.lead { line-height: 1.6; }

/* 面 */
.card, .scard, .srow, .take, .docv .pg, .seg, .mx-wrap { background: linear-gradient(180deg, var(--card-hi), transparent 40%), var(--surface); }
.card { border-radius: 16px; border-color: var(--line); box-shadow: var(--shadow); padding: 16px; }
.card.flat { background: var(--surface2); box-shadow: none; }
.memo, .cam { background: var(--surface2); border-left: 2px solid var(--line); border-radius: 4px 10px 10px 4px; }
.memo b, .cam b { letter-spacing: .08em; }

/* ボタン */
.btn { border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); transition: transform .08s, filter .15s; }
.btn:active { transform: translateY(1px) scale(.99); filter: brightness(.95); }
.btn.primary { background: var(--accent); background-image: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 55%); border-color: transparent; color: var(--accent-ink); box-shadow: 0 6px 18px var(--glow), inset 0 -2px 0 rgba(0,0,0,.12); letter-spacing: .04em; }
.btn.dark { background: var(--film); border-color: var(--film); color: var(--film-ink); }
.btn.small { border-radius: 999px; padding: 4px 12px; }
.seg { border-radius: 12px; padding: 4px; }
.seg button { letter-spacing: .04em; }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); box-shadow: inset 0 -2px 0 var(--accent); }
.chip { border-width: 1px; background: var(--surface2); }
.chip[aria-pressed="true"], .chip.sel { background: var(--sel); border-color: var(--sel); color: var(--sel-ink); }
.field input, .field select, .field textarea, .inp { border-width: 1px; border-radius: 10px; background: var(--surface2); }
.field input:focus, .field textarea:focus, .inp:focus { border-color: var(--accent); }
.field > span { letter-spacing: .08em; }

/* 撮影の日のカード（コールシート） */
.callsheet { position: relative; overflow: hidden; }
.callsheet::after { content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, var(--glow), transparent 70%); pointer-events: none; }
.callsheet .cs-date { font-family: var(--display); font-size: 44px; line-height: .95; letter-spacing: .03em; }
.callsheet .cs-date .wd { font-family: var(--font); font-size: 20px; font-weight: 800; letter-spacing: 0; margin-left: 4px; vertical-align: 6px; color: var(--muted); }
.callsheet .cs-call { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.callsheet .cs-call b { font-family: var(--display); font-size: 30px; font-weight: 400; color: var(--accent); letter-spacing: .04em; }
.callsheet .cs-call span { font-weight: 700; }
.sum { gap: 8px; }
.sum div { background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 8px; }
.sum b { font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1; letter-spacing: .03em; }
.sum span { font-size: 11px; letter-spacing: 0; white-space: nowrap; }
.bar { height: 12px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--surface2) 0 12px, transparent 12px 15px); border: 1px solid var(--line); }
.bar i { background: repeating-linear-gradient(90deg, var(--accent) 0 12px, transparent 12px 15px); box-shadow: 0 0 10px var(--glow); }

/* シーンのカード：左にフィルムの縁 */
.scard { position: relative; padding: 16px 16px 16px 34px; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.scard::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 20px; background-color: #0b0b0d;
  background-image: repeating-linear-gradient(180deg, transparent 0 7px, var(--hole2) 7px 15px, transparent 15px 20px);
  background-size: 7px 100%; background-repeat: repeat-y; background-position: 6px 0; }
.scard.now { box-shadow: 0 0 0 2px var(--accent), 0 10px 30px var(--glow); border-color: transparent; }
.scard.now::after { content: '次に撮る'; position: absolute; left: 0; top: 0; bottom: 0; width: 20px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 900; letter-spacing: .3em; writing-mode: vertical-rl; display: block; line-height: 20px; padding-top: 18px; }
.scard.done { background: linear-gradient(180deg, var(--card-hi), transparent 40%), var(--ok-bg); }
.scard .hd { align-items: center; gap: 10px; }
.scard .tm { font-family: var(--display); font-size: 34px; font-weight: 400; line-height: .9; color: var(--accent); letter-spacing: .04em; }
.scard .sn { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1; background: var(--ink); color: var(--surface); border-radius: 6px; padding: 4px 9px 2px; letter-spacing: .05em; }
.scard .pl { font-size: 18px; letter-spacing: .02em; }
.srow { border-left: 4px solid var(--accent); border-radius: 12px; }
.srow .no { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; letter-spacing: .04em; }
.srow .no small { font-family: var(--mono); font-size: 11px; letter-spacing: 0; margin-top: 2px; }
.grp-h .sn { font-family: var(--display); font-weight: 400; font-size: 26px; letter-spacing: .04em; }
.cutpill { font-family: var(--mono); font-weight: 700; border-width: 1px; border-radius: 6px; }
.ev { border-left: 2px dashed var(--line); }
.ev b { font-family: var(--mono); }
.take { border-radius: 12px; }
.take .ct { font-family: var(--mono); }
.take .sec { font-family: var(--mono); }
.timer { font-family: var(--mono); }
.badge { border-radius: 5px; letter-spacing: .04em; }

/* 記録の画面：カチンコ */
.slate { position: relative; padding-top: 16px; }
.clap { position: relative; height: 30px; margin: 0 2px -2px; border-radius: 6px 6px 2px 2px; z-index: 1;
  background: repeating-linear-gradient(-60deg, #f3efe6 0 18px, #0c0c0e 18px 36px); box-shadow: 0 2px 0 #000, 0 6px 14px rgba(0,0,0,.35);
  transform-origin: 12px 100%; transform: rotate(-6deg); transition: transform .14s cubic-bezier(.5,1.8,.6,1); }
.clap::before { content: ''; position: absolute; left: 6px; bottom: 6px; width: 12px; height: 12px; border-radius: 50%; background: #9aa0a8; box-shadow: inset 0 0 0 3px #4a4e55; }
.slate.run .clap { transform: rotate(0); }
.slate-body { position: relative; background: #0c0c0e; color: #f3efe6; border-radius: 4px 4px 16px 16px; padding: 22px 14px 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 1px #1f2024; }
.slate-body::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 12px; background: repeating-linear-gradient(60deg, #f3efe6 0 18px, #0c0c0e 18px 36px); border-radius: 4px 4px 0 0; }
.sl-title { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #a39e94; letter-spacing: .1em; }
.sl-title b { color: #f3efe6; font-weight: 800; letter-spacing: .04em; }
.sl-title span:last-child { font-family: var(--mono); white-space: nowrap; }
.sl-grid { display: grid; grid-template-columns: 1fr 1fr 1.25fr; border: 1.5px solid #f3efe6; border-radius: 4px; overflow: hidden; }
.sl-grid > div { padding: 6px 8px 4px; min-width: 0; }
.sl-grid > div + div { border-left: 1.5px solid #f3efe6; }
.sl-grid span { display: block; font-size: 11px; font-weight: 800; color: #a39e94; letter-spacing: .18em; }
.sl-grid b { display: block; font-family: var(--display); font-weight: 400; font-size: 64px; line-height: .92; color: #f3efe6; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl-grid b.long { font-size: 40px; padding-top: 12px; }
.tk { display: flex; align-items: center; gap: 2px; }
.tk input { width: 100%; min-width: 0; background: transparent; border: 0; border-bottom: 1.5px dashed #5a5d63; color: #f2a93b; font-family: var(--display); font-size: 64px; line-height: .92; text-align: center; padding: 0; border-radius: 0; }
.tk input:focus { outline: none; border-bottom-color: #f2a93b; }
.tk button { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 1px solid #4a4e55; color: #f3efe6; font-size: 18px; font-weight: 800; display: grid; place-items: center; text-align: center; }
.sl-files { display: grid; grid-template-columns: 1.5fr 1fr; gap: 8px; }
.sl-file { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sl-file span { font-size: 11px; font-weight: 800; color: #a39e94; letter-spacing: .12em; }
.sl-file input { width: 100%; min-width: 0; min-height: 46px; background: #17181b; border: 1px solid #3a3d43; border-radius: 8px; color: #fff; font-family: var(--mono); font-weight: 700; font-size: 19px; padding: 6px 10px; letter-spacing: .02em; }
.sl-file input::placeholder { color: #5d6067; font-weight: 500; }
.sl-file input:focus { outline: none; border-color: #f2a93b; box-shadow: 0 0 0 3px rgba(242,169,59,.25); }
.sl-file.main input { color: #f2a93b; font-size: 21px; }
.sl-sub { font-size: 13px; color: #cfc9be; line-height: 1.5; }
.tcode { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 0 0; border-top: 1px solid #25262a; margin-top: 2px; }
.tcode .recdot { width: 14px; height: 14px; border-radius: 50%; background: #34363b; flex: 0 0 auto; }
.tcode .rectxt { font-size: 12px; font-weight: 800; color: #8d9198; letter-spacing: .14em; }
.tcode.run .recdot { background: var(--rec); box-shadow: 0 0 12px var(--rec); animation: recblink 1s steps(2, start) infinite; }
.tcode.run .rectxt { color: var(--rec); }
.tcode .timer { font-family: var(--display); font-weight: 400; font-size: 68px; line-height: 1; color: #f3efe6; letter-spacing: .04em; }
.tcode.run .timer { color: #fff; text-shadow: 0 0 18px rgba(255,75,62,.35); }
@keyframes recblink { to { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .tcode.run .recdot { animation: none; } .clap { transition: none; } }
.slate .bigbtn { background: #1c1d21; color: #f3efe6; border: 1px solid #3a3d43; box-shadow: none; border-radius: 14px; letter-spacing: .1em; }
.slate .bigbtn.run { background: var(--rec); border-color: var(--rec); color: #fff; box-shadow: 0 8px 24px rgba(255,75,62,.3); }
.slate .results { gap: 8px; }
.slate .results button { border-radius: 14px; letter-spacing: .08em; font-family: var(--display); font-weight: 400; font-size: 30px; }
.slate .results .rOK { background: #2fa866; color: #fff; box-shadow: 0 6px 18px rgba(47,168,102,.28); }
.slate .results .rKEEP { background: transparent; color: #f2a93b; border-color: #f2a93b; }
.slate .results .rNG { background: #1c1d21; color: #c9c4ba; border-color: #3a3d43; }

/* PDF の下見 */
.pdfpages { display: flex; flex-direction: column; gap: 12px; }
.pdfpages img { display: block; width: 100%; height: auto; border-radius: 6px; box-shadow: var(--shadow); background: #fff; }
.pdfinfo { display: flex; align-items: center; gap: 12px; }
.pdfinfo .ico { flex: 0 0 auto; width: 44px; height: 56px; border-radius: 6px; background: #c0392b; color: #fff; display: grid; place-items: center; font-family: var(--display); font-size: 20px; letter-spacing: .06em; box-shadow: var(--shadow); }

<script>
(() => {
'use strict';
const VERSION = '3.2（11/3 画面の上のぼやけを直した）';

/* ───────── 基本 ───────── */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const half = s => String(s ?? '').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' ');
const uniq = a => [...new Set(a.filter(Boolean))];
const pad2 = n => String(n).padStart(2, '0');
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200); }
function buzz(p = 15) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function busy(on, text) { $('busy').hidden = !on; if (text) $('busytext').textContent = text; }
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function nowHM() { const d = new Date(); return `${d.getHours()}:${pad2(d.getMinutes())}`; }
function hm2min(s) { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : null; }
function fmtSec(s) { s = Math.round(+s || 0); if (!s) return ''; return `${Math.floor(s / 60)}:${pad2(s % 60)}`; }
function parseSec(v) { v = half(v).trim(); if (!v) return 0; const m = /^(\d+)[:分'](\d{1,2})/.exec(v); if (m) return +m[1] * 60 + +m[2]; const n = parseFloat(v); return isNaN(n) ? 0 : Math.round(n); }
function fmtAt(ts) { if (!ts) return ''; const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad2(d.getMinutes())}`; }
function natCmp(a, b) { return String(a).localeCompare(String(b), 'ja', { numeric: true }); }

/* ───────── 置かれた場所 ───────── */
const PRESET = window.SATSUEICHO_PRESET || null;
const MODE = { artifact: !!(PRESET && PRESET.artifact) }; // 印刷・ファイル保存ができない場所に置いたとき

/* ───────── 保存 ───────── */
const KEY = 'satsueicho.v1.project', UIKEY = 'satsueicho.v1.ui';
function blank() { return { v: 1, title: '', draft: '', director: '', memo: '', chars: [], credits: [], rules: [], camPlan: [], imgs: [], days: [], scenes: [], slots: [], events: [], takes: [], checks: {}, docs: [], gear: [], updated: 0 }; }
function load() { try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.v) return Object.assign(blank(), j); } catch (e) {} return blank(); }
let P = load();
const S = Object.assign({ tab: 'docs', planView: 'script', logOrder: 'script', logFilter: 'all', day: null, sheets: [], run: null, last: null, recCut: {}, wake: false, scroll: {} },
  (() => { try { return JSON.parse(localStorage.getItem(UIKEY)) || {}; } catch (e) { return {}; } })());
let pending = [];          // 読み取り済みで、まだ取り込んでいない資料
function applyTheme() { const t = S.theme || 'dark'; if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; }
applyTheme();
let saveT;
function save(now) {
  P.updated = Date.now();
  clearTimeout(saveT);
  const w = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { toast('保存できませんでした（端末の空きが足りません）'); } };
  if (now) w(); else saveT = setTimeout(w, 200);
}
function persist() { try { localStorage.setItem(UIKEY, JSON.stringify(S)); } catch (e) {} }

/* ───────── 画像（端末の IndexedDB に保存） ───────── */
const IMG = {};
const IDB = {
  db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => { const r = indexedDB.open('satsueicho', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); }); },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('img', mode); const out = fn(t.objectStore('img')); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }); },
  put(k, v) { return this.tx('readwrite', st => { st.put(v, k); }); },
  del(k) { return this.tx('readwrite', st => { st.delete(k); }); },
  clear() { return this.tx('readwrite', st => { st.clear(); }); },
  async all() { const db = await this.open(); return new Promise((res, rej) => { const out = {}; const t = db.transaction('img', 'readonly'); const c = t.objectStore('img').openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); }); },
};
async function addImage(data, name, doc) { const id = uid(); IMG[id] = data; try { await IDB.put(id, data); } catch (e) { toast('画像を保存できませんでした'); } P.imgs.push({ id, name, doc: doc || '' }); return id; }
function imgUsed(id) { return P.scenes.some(sc => (sc.refs || []).includes(id)) || P.docs.some(d => (d.pages || []).includes(id)); }
async function dropImage(id) { if (imgUsed(id)) return; P.imgs = P.imgs.filter(m => m.id !== id); delete IMG[id]; try { await IDB.del(id); } catch (e) {} }
async function fileToJpeg(file, max = 1600) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.8);
  } finally { URL.revokeObjectURL(url); }
}
async function pdfPages(buf, name) {
  await need('pdf');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)), cMapUrl: 'lib/cmaps/', cMapPacked: true }).promise;
  const ids = [];
  for (let p = 1; p <= Math.min(pdf.numPages, 60); p++) {
    busy(true, `ページを画像にしています（${p}/${pdf.numPages}）`);
    const page = await pdf.getPage(p), v0 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: Math.min(3, 1400 / Math.max(v0.width, v0.height)) });
    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    ids.push(await addImage(c.toDataURL('image/jpeg', 0.75), `${name.replace(/\.pdf$/i, '')} ${p}ページ`, name));
  }
  return ids;
}
const thumbs = (ids, list) => (ids || []).filter(id => IMG[id]).map((id, i) => `<button class="thumb" data-a="viewImg" data-id="${id}" data-list="${esc((list || ids).join(','))}"><img src="${IMG[id]}" alt="${esc((P.imgs.find(m => m.id === id) || {}).name || '参考画像')}" loading="lazy"></button>`).join('');

/* ───────── データの道具 ───────── */
const sceneById = id => P.scenes.find(s => s.id === id);
const dayById = id => P.days.find(d => d.id === id);
function normNo(s) {
  s = half(s).toUpperCase().replace(/\s+/g, '').replace(/^(S#|SC|S|#|シーン|SCENE|第)/, '').replace(/(場|シーン)$/, '');
  const m = /^0*(\d+)([A-Z]?)/.exec(s);
  return m ? m[1] + m[2] : s;
}
function cmpScene(a, b) { return natCmp(a.no, b.no) || (a.seq ?? 1e9) - (b.seq ?? 1e9); }
function scriptOrder() { return P.scenes.slice().sort(cmpScene); }
function findScene(no) { no = normNo(no); return P.scenes.find(s => s.no === no); }
function newScene(no) {
  const sc = { id: uid(), no: no ? normNo(no) : String(nextSceneNo()), place: '', tod: '', io: '', loc: '', summary: '', dir: '', cast: [], extras: '', props: [], costume: '', makeup: '', notes: '', day: '', start: '', mins: 0, order: 0, lines: [], secs: 0, cuts: [], refs: [], axis: '', link: '', cont: '', edit: '', done: false, noshoot: false };
  P.scenes.push(sc); return sc;
}
function nextSceneNo() { return P.scenes.reduce((m, s) => Math.max(m, parseInt(s.no, 10) || 0), 0) + 1; }
function sameName(a, b) {
  if (a === b) return true;
  if (a.length < 2 || b.length < 2) return false;
  const [l, sh] = a.length >= b.length ? [a, b] : [b, a];
  return l.endsWith(sh) || (l.length - sh.length >= 2 && l.startsWith(sh));
}
function unionNames(base, add) {
  const out = (base || []).slice();
  for (const n of add || []) { if (n && !out.some(o => sameName(o, n))) out.push(n); }
  return out;
}
function allNames() {
  let names = P.chars.map(c => c.name);
  for (const sc of scriptOrder()) names = unionNames(names, sc.cast);
  return names;
}
function addChars(list) { for (const c of list || []) { const name = typeof c === 'string' ? c : c.name; if (!name) continue; const ex = P.chars.find(x => sameName(x.name, name)); if (!ex) P.chars.push({ name, note: c.note || '' }); else if (c.note && !ex.note) ex.note = c.note; } }
function splitList(s, names) {
  s = String(s || '').trim(); if (!s) return [];
  let parts = s.split(/[、,，・\/／\n;；]+/);
  if (names && parts.length === 1 && /[\s　]/.test(parts[0])) parts = parts[0].split(/[\s　]+/);
  return uniq(parts.map(x => x.trim().replace(/^[・\-－]+/, '')));
}
const listText = a => (a || []).join('、');
function getDay(label) {
  label = String(label).trim();
  let d = P.days.find(x => x.label === label);
  const iso = parseDate(label);
  if (!d && iso) d = P.days.find(x => x.date === iso);
  if (!d) { d = { id: uid(), label, date: iso, call: '', meet: '', notes: '' }; P.days.push(d); sortDays(); }
  return d;
}
function sortDays() { P.days.sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999') || natCmp(a.label, b.label)); }
function parseDate(s) {
  s = half(s);
  let m = /(\d{4})[\/\-年.](\d{1,2})[\/\-月.](\d{1,2})/.exec(s), y, mo, d;
  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = /(\d{1,2})[\/月.](\d{1,2})/.exec(s))) {
    mo = +m[1]; d = +m[2]; const now = new Date(); y = now.getFullYear();
    if (new Date(y, mo - 1, d) < new Date(now.getFullYear(), now.getMonth() - 6, 1)) y++;
  } else return '';
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
  return `${y}-${pad2(mo)}-${pad2(d)}`;
}
function dayLabel(d) { if (!d) return '日程未定'; return d.label || (d.date ? d.date.slice(5).replace('-', '/') : '撮影日'); }
function timeline(dayId) {
  const items = P.scenes.filter(s => (s.day || '') === (dayId || '')).map(s => ({ t: 'sc', o: s }));
  if (dayId) P.events.filter(e => e.day === dayId).forEach(e => items.push({ t: 'ev', o: e }));
  if (dayId) (P.slots || []).filter(x => x.day === dayId && sceneById(x.sc)).forEach(x => items.push({ t: 'sl', o: x }));
  items.sort((a, b) => (a.o.order || 0) - (b.o.order || 0) || (hm2min(a.o.start) ?? 1e4) - (hm2min(b.o.start) ?? 1e4) || (a.t === 'sc' && b.t === 'sc' ? cmpScene(a.o, b.o) : 0));
  return items;
}
const itemScene = it => (it.t === 'sc' ? it.o : it.t === 'sl' ? sceneById(it.o.sc) : null);
const dayScenes = dayId => uniq(timeline(dayId).map(itemScene));
function nextOrder(dayId) { return timeline(dayId).reduce((m, it) => Math.max(m, it.o.order || 0), 0) + 10; }

/* テイク */
const takesOf = (scId, cut) => P.takes.filter(t => t.sc === scId && (cut === undefined || (t.cut || '') === (cut || ''))).sort((a, b) => (a.n || 0) - (b.n || 0));
function nextTakeNo(scId, cut) { return takesOf(scId, cut).reduce((m, t) => Math.max(m, t.n || 0), 0) + 1; }
function bump(s) { const m = /^(.*?)(\d+)(\D*)$/.exec(s || ''); if (!m) return s || ''; return m[1] + String(+m[2] + 1).padStart(m[2].length, '0') + m[3]; }
function lastTakeWith(k) { let best = null; for (const t of P.takes) if (t[k] && (!best || t.at > best.at)) best = t; return best; }
function suggest(k) { const t = lastTakeWith(k); return t ? bump(t[k]) : ''; }
function cutLabel(sc, cutId) { if (!cutId) return '一連'; const c = sc.cuts.find(x => x.id === cutId); return c ? 'C' + c.no : 'C?'; }
function cutState(sc, cutId) { const ts = takesOf(sc.id, cutId); return { n: ts.length, ok: ts.some(t => t.r === 'OK'), keep: ts.some(t => t.r === 'KEEP') }; }
function sceneOk(sc) {
  if (sc.cuts.length) return sc.cuts.every(c => cutState(sc, c.id).ok);
  return takesOf(sc.id).some(t => t.r === 'OK');
}
function sceneProgress(sc) {
  if (sc.cuts.length) { const ok = sc.cuts.filter(c => cutState(sc, c.id).ok).length; return { ok, all: sc.cuts.length }; }
  return { ok: sceneOk(sc) ? 1 : 0, all: 1 };
}
function sceneDone(sc) { return sc.done || (P.takes.some(t => t.sc === sc.id) && sceneOk(sc)); }
function missingCuts(sc) { if (sc.noshoot) return []; return missingCuts0(sc); }

async function commitPending(id, quiet) {

  else if (d.kind === 'table') { const r = tableResult(d); applyTable(r, d.name); msg = `表を取り込みました（シーン ${uniq(r.recs.map(x => x.no)).length}・カット ${r.cuts.length}）`; }

}
async function readFiles(files) {
  files = [...files]; if (!files.length) return;
  busy(true, '読み取り中…');
  for (const f of files) {
    try {
      if (/\.json$/i.test(f.name)) { await restoreFile(f); continue; }
      const d = analyze(await extract(f));
      pending = pending.filter(x => x.name !== d.name); pending.push(d);
    } catch (e) { pending.push({ id: uid(), name: f.name, error: e.message || String(e) }); }
  }
  busy(false);
  setTab('docs');
  requestAnimationFrame(() => { const el = document.querySelector('.pend'); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); });
}
function readPasted(text, kind) {
  if (!text.trim()) { toast('文字が入っていません'); return; }
  const d = analyze({ name: '貼り付け ' + fmtAt(Date.now()), text, tables: /\t/.test(text) ? tabTables(text, '貼り付け') : [] });
  if (kind) d.kind = kind;
  pending.push(d); S.paste = false; render();
}

  } else {

/* ───────── 香盤 ───────── */

/* ───────── 撮影（当日） ───────── */
function pickDay() {

  const d = P.days.find(x => x.date === t) || P.days.find(x => dayScenes(x.id).some(sc => !sceneDone(sc))) || P.days[0];

}
function prepChip(key, label) { return `<button class="chip" role="checkbox" aria-checked="${chk(key)}" data-a="check" data-k="${esc(key)}"><span class="tk"></span>${esc(label)}</button>`; }

/* ───────── 記録（スクリプトシート） ───────── */
function orderedScenes(mode) {
  if (mode === 'shoot') return uniq(P.days.flatMap(d => dayScenes(d.id)).concat(P.scenes.filter(s => !s.day).sort(cmpScene)));
  return scriptOrder();
}

}

  return `<button class="take" data-a="openTake" data-id="${t.id}"><span class="ct">${esc(cutLabel(sc, t.cut))} T${t.n}</span><span class="badge r-${t.r || 'none'}">${esc(t.r || '—')}</span><span class="inf">${info || '&nbsp;'}</span><span class="sec">${fmtSec(t.sec)}</span></button>`;
}
function renderLog() {
  let h = `<div class="wrap">
    <div class="seg">${[['script', '台本の順'], ['shoot', '撮影の順']].map(([k, l]) => `<button data-a="logOrder" data-k="${k}" aria-pressed="${S.logOrder === k}">${l}</button>`).join('')}</div>
    <div class="seg">${[['all', 'すべて'], ['ok', 'OK・KEEPだけ'], ['miss', '撮り残し']].map(([k, l]) => `<button data-a="logFilter" data-k="${k}" aria-pressed="${S.logFilter === k}">${l}</button>`).join('')}</div>`;
  const all = P.takes.length, ok = P.takes.filter(t => t.r === 'OK').length, keep = P.takes.filter(t => t.r === 'KEEP').length;
  h += `<p class="small">テイク ${all}（OK ${ok}・KEEP ${keep}・NG ${P.takes.filter(t => t.r === 'NG').length}）。テイクをタップすると直せます。</p>`;
  if (all && !MODE.artifact) h += `<button class="btn primary wide" data-a="pdfScript">スクリプトシートを PDF で監督に送る</button>`;

        <button class="btn small" data-a="openRec" data-id="${sc.id}" style="align-self:flex-start">記録する</button></div>`;
    }

async function download(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  try {
    const file = new File([blob], name, { type: mime });
    if (/iPhone|iPad|Android/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('保存しました：' + name);
}

function parseWorkLink(str) { const m = /open=([\w-]+)&k=([^&\s#]+)/.exec(String(str || '')); return m ? { name: m[1], key: decodeURIComponent(m[2]) } : null; }
async function decryptWork(name, key) {
  const res = await fetch(`works/${name}.bin`, { cache: 'no-cache' });
  if (!res.ok) throw new Error('なし');
  const buf = new Uint8Array(await res.arrayBuffer());
  if (String.fromCharCode(...buf.slice(0, 4)) !== 'STK1') throw new Error('形式');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(key), 'PBKDF2', false, ['deriveKey']);

}

async function mergeProject(j) {
  const images = j.images || []; delete j.images;
  for (const im of images) if (!IMG[im.id]) { IMG[im.id] = im.data; try { await IDB.put(im.id, im.data); } catch (e) {} }
  const old = P;
  for (const sc of j.scenes) {
    const o = old.scenes.find(x => x.id === sc.id) || old.scenes.find(x => x.no === sc.no);
    if (!o) continue;
    sc.id = o.id; if (o.done) sc.done = true; if (o.cont) sc.cont = o.cont;
    for (const c of sc.cuts) { const oc = o.cuts.find(x => x.id === c.id) || o.cuts.find(x => x.no === c.no); if (oc) { c.id = oc.id; if (oc.pick) c.pick = oc.pick; } }
  }
  P = Object.assign(blank(), j, { takes: old.takes, checks: old.checks, work: old.work });
  save(true); render();
}
async function openWork(name, key) {
  try {
    busy(true, '作品を開いています…');
    let j = null;
    if (name) j = await decryptWork(name, key);
    else { // 鍵だけ貼られたときは、置いてある作品を順に試す
      for (const n of Object.keys(await workIndex())) { try { j = await decryptWork(n, key); name = n; break; } catch (e) {} }
      if (!j) throw new Error('鍵');
    }
    busy(false);
    if (P.scenes.length && P.title === j.title) {
      P.work = { name, key }; save(true);
      if ((j.rev || 1) > (P.rev || 1)) { if (await ask(`「${j.title}」の資料が新しくなっています${j.revNote ? `（${j.revNote}）` : ''}。付けた記録はそのままで、資料だけ新しくしますか？`, '新しくする')) { await mergeProject(j); $('workbar').hidden = true; toast('資料を新しくしました（記録はそのままです）'); } }
      else toast(`「${j.title}」はもう開いています（記録はそのままです）`);
      return true;
    }
    if (P.scenes.length && !await ask(`「${j.title}」を開きます。今の内容（${P.title || '作品'}）と入れ替わります。よろしいですか？`, '開く')) return false;

let PDFOUT = null;
const PJP = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif';
const PNUM = '"Bebas Neue",' + PJP, PMONO = '"JetBrains Mono",ui-monospace,Menlo,monospace';
async function fontsReady() { try { await Promise.all(['40px "Bebas Neue"', '700 20px "JetBrains Mono"', '500 20px "JetBrains Mono"'].map(f => document.fonts.load(f))); } catch (e) {} }
function pdfBlob(pages, title) {
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n`); body(); push('\nendobj\n'); };
  const u16 = s => { let h = 'FEFF'; for (const ch of s) { const c = ch.codePointAt(0); if (c > 0xffff) { const v = c - 0x10000; h += (0xD800 + (v >> 10)).toString(16).padStart(4, '0') + (0xDC00 + (v & 0x3ff)).toString(16).padStart(4, '0'); } else h += c.toString(16).padStart(4, '0'); } return '<' + h.toUpperCase() + '>'; };
  const PW = 841.89, PH = 595.28, n = pages.length;
  push('%PDF-1.4\n'); push(new Uint8Array([37, 226, 227, 207, 211, 10]));
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${pages.map((p, i) => `${4 + i * 3} 0 R`).join(' ')}] /Count ${n} >>`));
  obj(3, () => push(`<< /Title ${u16(title)} /Creator ${u16('キネコマ')} /Producer ${u16('キネコマ')} >>`));
  pages.forEach((p, i) => {
    const po = 4 + i * 3, io = po + 1, co = po + 2, cs = `q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`;
    obj(po, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im${i} ${io} 0 R >> >> /Contents ${co} 0 R >>`));
    obj(io, () => { push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`); push(p.jpg); push('\nendstream'); });
    obj(co, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  });

  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for (let k = 1; k < total; k++) push(String(offs[k]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

}

  // ページに割り付ける（シーンの途中で改ページしたら、シーンの帯と表の見出しをもう一度）

    const b = blocks[i];

  gearEdit: () => openSheet({ t: 'gear' }),
  gearSave: () => { P.gear = uniq($('gearText').value.split('\n').map(x => x.trim())); save(); closeSheet(); },
};
function renderSheetsKeep() { renderSheets(); }
async function addImgFiles(files, scId) {
  const sc = sceneById(scId); if (!sc) return;
  busy(true, '画像を入れています…');
  for (const f of files) { try { const id = await addImage(await fileToJpeg(f), f.name, ''); sc.refs = (sc.refs || []).concat(id); } catch (e) { toast('画像を読めませんでした：' + f.name); } }
  busy(false); save(); render();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT' || b.tagName === 'DETAILS') return;
  if (b.disabled) return;
  const f = ACT[b.dataset.a]; if (f) { e.preventDefault(); f(b, e); }
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.dataset && d.dataset.a === 'gearOpen') { S.gearOpen = d.open; persist(); }
  if (d.dataset && d.dataset.a === 'pendOpen') { const p = pending.find(x => x.id === d.dataset.id); if (p) p.tinfo[+d.dataset.i].open = d.open; }
}, true);
function bindValue(t) {
  const [kind, id, a, b] = t.dataset.b.split('|');
  let v = t.type === 'checkbox' ? t.checked : t.value;
  if (kind === 'p') {
    if (a === 'credits') v = String(v).split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = /^(.+?)[：:]\s*(.*)$/.exec(l); return m ? { role: m[1].trim(), name: m[2].trim() } : { role: '', name: l }; });
    if (a === 'rules' || a === 'camPlan') v = String(v).split('\n').map(l => l.trim()).filter(Boolean);
    P[a] = v; if (a === 'title') renderTop();
  }
  else if (kind === 'sc') { const sc = sceneById(id); if (!sc) return; if (t.dataset.list) v = splitList(v, a === 'cast'); if (a === 'no') v = normNo(v) || v; if (a === 'mins') v = +half(v).replace(/[^\d]/g, '') || 0; if (a === 'start') v = normTime(v) || v; if (a === 'day' && v !== sc.day) sc.order = nextOrder(v); sc[a] = v; }
  else if (kind === 'cut') { const sc = sceneById(id); const c = sc && sc.cuts.find(x => x.id === a); if (!c) return; if (b === 'alts') v = String(v).split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [when, cam, why] = l.split(/[｜|]/).map(x => (x || '').trim()); return { when: when || '別案', cam: cam || '', why: why || '' }; }); c[b] = v; }
  else if (kind === 'tk') { const tk = P.takes.find(x => x.id === id); if (!tk) return; if (a === 'n') v = +half(v).replace(/\D/g, '') || tk.n; if (a === 'sec') v = parseSec(v); tk[a] = v; }
  else if (kind === 'day') { const d = dayById(id); if (!d) return; d[a] = v; if (a === 'date') sortDays(); }
  save();
}
document.addEventListener('input', e => { const t = e.target;
  if (t.id === 'guideq') { const q = t.value.trim(); t.closest('.sheet-body').querySelectorAll('.gitem').forEach(el => { el.hidden = !!q && !el.dataset.q.includes(q); }); return; } if (t.dataset.b && !t.dataset.list && t.tagName !== 'SELECT') bindValue(t); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.b) { bindValue(t); if (t.tagName === 'SELECT' || t.dataset.list || t.dataset.rerender) render(); else { const top = S.sheets[S.sheets.length - 1]; if (top && top.t === 'scene' && /\|(no|place|tod|io)$/.test(t.dataset.b)) { const el = document.querySelector('#sheets .sheet:last-child .sheet-top .t'); const sc = sceneById(top.id); if (el && sc) el.textContent = sceneTitle(sc); } RENDER[S.tab](); } return; }
  const a = t.dataset.a, p = t.dataset.id && pending.find(x => x.id === t.dataset.id);
  if (a === 'pendKind' && p) { p.kind = t.value; render(); }
  else if (a === 'pendMap' && p) { p.tinfo[+t.dataset.i].map[+t.dataset.c] = t.value; render(); }
  else if (a === 'pendHdr' && p) { const ti = p.tinfo[+t.dataset.i], rows = p.tables[+t.dataset.i].rows; const r = Math.max(0, Math.min(rows.length - 1, (+t.value || 1) - 1)); ti.hdr = r; ti.map = guessMap(rows, r); render(); }
  else if (a === 'pendOff' && p) { p.tinfo[+t.dataset.i].off = !t.checked; render(); }
  else if (a === 'pendGear' && p) { p.toGear = t.checked; }
  else if (a === 'pendPages' && p) { p.toPages = t.checked; }
  else if (t.id === 'imgfile') { addImgFiles(t.files, t.dataset.sc); t.value = ''; }
  else if (t.id === 'file') { readFiles(t.files); t.value = ''; }
  else if (t.id === 'restore') { if (t.files[0]) restoreFile(t.files[0]); t.value = ''; }
  else if (t.id === 'outDay') { S.outDay = t.value; persist(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'gearInput') { e.preventDefault(); ACT.gearAdd(); }
  if (e.key === 'Enter' && e.target.classList.contains('worklink')) { e.preventDefault(); openPasted(e.target); }
  if (e.key === 'Escape' && S.sheets.length) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'drop') { e.preventDefault(); $('file').click(); }
});
// ファイル選択とドラッグ
document.addEventListener('click', e => { if (e.target.closest('#drop')) { e.preventDefault(); $('file').click(); } });
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); const d = $('drop'); if (d) d.classList.add('over'); } }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { const d = $('drop'); if (d && (ev === 'drop' || e.target === d)) d.classList.remove('over'); }));
document.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); readFiles(e.dataTransfer.files); } });

// 撮影中は画面を消さない
let lock = null;
async function applyWake() {
  try {
    if (S.wake && 'wakeLock' in navigator && document.visibilityState === 'visible') { if (!lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } }
    else if (lock) { await lock.release(); lock = null; }
  } catch (e) { lock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { save(true); persist(); } else { applyWake(); renderTop(); checkUpdate(); checkWorkUpdate(); } });
window.addEventListener('pagehide', () => { save(true); persist(); });
setInterval(renderTop, 15000);

// 新しい版のお知らせ
async function checkUpdate() {
  if ((location.protocol !== 'https:' && location.hostname !== 'localhost') || MODE.artifact) return;
  try {
    const t = await (await fetch('index.html', { cache: 'no-store' })).text();
    const v = (/const VERSION = '([^']+)'/.exec(t) || [])[1];
    const bar = $('updbar');
    if (v && v !== VERSION) { bar.hidden = false; bar.innerHTML = `<button data-a="hardUpdate">アプリの新しい版（${esc(v)}）があります。ここをタップで更新（記録は消えません）</button>`; }
  } catch (e) {}
}

// 入力欄の候補
document.body.insertAdjacentHTML('beforeend', `<datalist id="todlist">${['朝', '昼', '夕', '夜', '深夜', '早朝'].map(x => `<option value="${x}">`).join('')}</datalist><datalist id="sizelist">${['引き', 'フル', 'ニー', 'ウエスト', 'ミディアム', 'バスト', 'アップ', '寄り', 'ルーズ', 'タイト', '2ショット', '肩なめ', '主観', '俯瞰', 'あおり', 'インサート', '移動'].map(x => `<option value="${x}">`).join('')}</datalist>`);

async function boot() {
  if (location.search) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
  try { Object.assign(IMG, await IDB.all()); } catch (e) {}
  await openFromLink();
  // 同梱の作品データがあり、この端末にまだ何も入っていなければ、それを開く
  if (PRESET && PRESET.data && !P.scenes.length) {
    const j = JSON.parse(JSON.stringify(PRESET.data)); const images = j.images || []; delete j.images;
    for (const im of images) { IMG[im.id] = im.data; try { await IDB.put(im.id, im.data); } catch (e) {} }
    P = Object.assign(blank(), j); S.tab = 'shoot'; S.day = null; save(true); persist();
  }
  if (!P.scenes.length) S.tab = 'docs';
  render();
  checkWorkUpdate();
  if (!S.helpSeen && P.scenes.length) { S.helpSeen = true; persist(); openSheet({ t: 'help' }); }
}
render();
boot();
window.addEventListener('hashchange', () => openFromLink());
applyWake();
checkUpdate();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !MODE.artifact) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
